<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طلبات المغسلة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0A55AA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body data-mode="customer">
<div id="app" dir="rtl" lang="ar">
  <header class="demo-bar pad" id="topbar" hidden>
    <span></span>
    <button class="ghost-btn" id="install-btn" type="button" hidden></button>
  </header>
  <main class="stage">
    <div class="col" id="col-c">
      <section class="device" id="dev-c" aria-label="الطلبات"><div class="view"></div><div class="toasts" role="status" aria-live="polite"></div></section>
    </div>
  </main>
</div>
<!-- invisible check that the SMS sign-in is used by a person, not a script -->
<div id="recaptcha"></div>
<script type="module" src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
</html>
