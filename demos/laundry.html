<title>نموذج مغسلة سنا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0A55AA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Identity: "fresh linen" — airy blues on cool white, soft rounded cards, garment icons on tinted tiles.
   Every order number is printed on the yellow paper tag laundries pin to garments.
   Layout: customer app + shop dashboard side by side on wide screens; one at a time on phones. */
:root{
  --bg:#F2F7FB; --surface:#FFFFFF; --sunk:#EAF1F7; --ink:#0D2233; --muted:#526879; --line:#D9E4ED;
  --brand:#0B63C4; --brand-ink:#FFFFFF; --brand-soft:#E2EEFB; --brand-text:#0A58AE;
  --hero-a:#0A4F9E; --hero-b:#1E7FE0; --hero-ink:#FFFFFF; --hero-chip:rgba(255,255,255,.16);
  --live:#7CE3B4;
  --tag:#F6D35B; --tag-ink:#3A2E00; --tag-soft:#FDF3C9; --tag-line:rgba(58,46,0,.35);
  --t-men:#E2EEFB; --t-men-ink:#0A58AE; --t-women:#F7E7F4; --t-women-ink:#8E3381;
  --t-kids:#FFF0D2; --t-kids-ink:#8A5300; --t-home:#DCF3EC; --t-home-ink:#146B54;
  --ok:#17784F; --ok-soft:#DBF2E5; --warn:#8A5200; --warn-soft:#FCEBCB; --bad:#B4322B; --bad-soft:#FBE3E0; --on-bad:#FFFFFF;
  --wa-bg:#E9E4DA; --wa:#FFFFFF; --wa-ink:#1B2A26;
  --scrim:rgba(8,24,40,.5);
  --shadow:0 1px 2px rgba(13,34,51,.06),0 12px 32px rgba(13,34,51,.10);
  --shadow-sm:0 1px 3px rgba(13,34,51,.10);
  --f-display:"Alexandria","Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1520; --surface:#112131; --sunk:#0D1B29; --ink:#E5EEF6; --muted:#97AABC; --line:#243749;
    --brand:#6AAEF5; --brand-ink:#03162A; --brand-soft:#14304D; --brand-text:#8CC2FA;
    --hero-a:#0B2A4A; --hero-b:#14477D; --hero-ink:#F2F7FC; --hero-chip:rgba(255,255,255,.12);
    --live:#6BD69A;
    --tag:#E8C547; --tag-ink:#2A2100; --tag-soft:#3A3315; --tag-line:rgba(42,33,0,.45);
    --t-men:#14304D; --t-men-ink:#9CCBFA; --t-women:#3A1F37; --t-women-ink:#EBB1E0;
    --t-kids:#3A2B12; --t-kids-ink:#F2C878; --t-home:#10352D; --t-home-ink:#7EDDBE;
    --ok:#52C48E; --ok-soft:#123426; --warn:#E9A443; --warn-soft:#3A2A10; --bad:#F07E76; --bad-soft:#3E1B19; --on-bad:#2A0B09;
    --wa-bg:#0B1416; --wa:#1F2C2F; --wa-ink:#E3EEF0;
    --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#112131; --sunk:#0D1B29; --ink:#E5EEF6; --muted:#97AABC; --line:#243749;
  --brand:#6AAEF5; --brand-ink:#03162A; --brand-soft:#14304D; --brand-text:#8CC2FA;
  --hero-a:#0B2A4A; --hero-b:#14477D; --hero-ink:#F2F7FC; --hero-chip:rgba(255,255,255,.12);
  --live:#6BD69A;
  --tag:#E8C547; --tag-ink:#2A2100; --tag-soft:#3A3315; --tag-line:rgba(42,33,0,.45);
  --t-men:#14304D; --t-men-ink:#9CCBFA; --t-women:#3A1F37; --t-women-ink:#EBB1E0;
  --t-kids:#3A2B12; --t-kids-ink:#F2C878; --t-home:#10352D; --t-home-ink:#7EDDBE;
  --ok:#52C48E; --ok-soft:#123426; --warn:#E9A443; --warn-soft:#3A2A10; --bad:#F07E76; --bad-soft:#3E1B19; --on-bad:#2A0B09;
  --wa-bg:#0B1416; --wa:#1F2C2F; --wa-ink:#E3EEF0;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column}

/* demo bar */
.demo-bar{flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.demo-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.demo-tag b{color:var(--ink);font-weight:700}
.demo-tag .dot{width:10px;height:10px;border-radius:50%;background:var(--tag);flex:none;box-shadow:0 0 0 3px var(--tag-soft)}
.demo-tag .long{display:none}
@media (min-width:640px){.demo-tag .long{display:inline}.demo-tag .short{display:none}}
.switch{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:3px}
.switch button{min-height:40px;border-radius:11px;font-weight:700;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:var(--on-bad);font:700 12.5px/22px var(--f-body);text-align:center}
.ghost-btn{min-height:40px;border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:14px;font-weight:700;background:var(--surface);white-space:nowrap}

/* stage */
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.col.is-off{display:none}
.col-cap{display:none}
.device{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px;scroll-padding-top:70px}
@media (min-width:900px){
  .switch{display:none}
  .stage{gap:40px;padding:18px 24px 24px}
  .col,.col.is-off{display:flex;flex:none;width:400px;gap:8px}
  .col-cap{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);padding-inline:10px}
  .col-cap b{color:var(--ink);font:700 15px var(--f-display)}
  .device{border-radius:34px;border:1px solid var(--line);box-shadow:var(--shadow);max-height:900px}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:14px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--surface);line-height:1.3}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--brand) 70%,transparent)}
.btn.wide{width:100%}
.btn.split{justify-content:space-between}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14.5px;border-radius:12px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--brand-text)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn:disabled{opacity:.5;box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;min-height:42px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.chip-btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip-btn .cnt{font-size:12.5px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand-text)}
.stack{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-title{font:700 16px/1.4 var(--f-display);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.sec-head h2{font-size:17px}
.topbar{display:flex;align-items:center;gap:10px;padding-block:16px 6px}
.topbar h1{font-size:22px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);flex:none}
.stepper button{width:40px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--brand-text);border-radius:999px}
.stepper output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14.5px;font-weight:700}
.input{width:100%;min-height:48px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);outline:3px solid var(--brand-soft);outline-offset:0}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13.5px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer;background:var(--surface)}
.opt.is-on{border-color:var(--brand);background:var(--brand-soft)}
.opt.is-off{opacity:.55;cursor:not-allowed}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.opt-main{display:flex;flex-direction:column;min-width:0}
.opt-name{font-weight:700}
.opt-sub{font-size:13.5px;color:var(--muted)}
.opt-price{margin-inline-start:auto;font-weight:800;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:72px;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);text-align:start}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice b{font-size:15px;display:flex;align-items:center;gap:6px}
.choice span{font-size:13.5px;color:var(--muted)}
.choice:disabled{opacity:.5}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{min-height:52px;padding:8px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700}
.slot small{font-weight:700;font-size:12.5px;color:var(--muted)}
.slot[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.slot:disabled{opacity:.55;background:var(--sunk)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.55;background:var(--sunk)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}
.notice svg{flex:none;margin-top:2px}
.totals{display:flex;flex-direction:column;gap:8px;font-size:15px}
.totals .row{display:flex;justify-content:space-between;gap:12px}
.totals .row.total{font-weight:800;font-size:18px;padding-top:10px;border-top:1.5px dashed var(--line);margin-top:2px}
.totals .row.disc{color:var(--ok)}
.footbar{flex:none;padding-block:12px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;box-shadow:0 -8px 20px -16px rgba(0,0,0,.4)}
.footbar .hint{font-size:13px;color:var(--muted);text-align:center}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-block:6px max(8px,env(safe-area-inset-bottom,0px))}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:12.5px;color:var(--muted);padding:4px;font-weight:700}
.tabbar button[aria-current="page"]{color:var(--brand-text)}
.tabbar button[aria-current="page"] .t-ic{background:var(--brand-soft)}
.t-ic{display:grid;place-items:center;width:48px;height:28px;border-radius:999px}
.tabbar .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:20px;height:20px;line-height:20px;font-size:11.5px}

/* steps */
.steps{list-style:none;margin:0;padding:6px 0 0;display:flex;gap:6px}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.steps li::before{content:"";height:5px;border-radius:3px;background:var(--line)}
.steps li.done::before,.steps li.cur::before{background:var(--brand)}
.steps li.cur{color:var(--ink)}

/* customer: home */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);padding-block:18px 26px;border-radius:0 0 30px 30px}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.brand-row{position:relative;display:flex;align-items:center;gap:12px}
.logo{width:50px;height:50px;border-radius:16px;background:#fff;color:#0A58AE;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.brand-name{font:700 21px/1.25 var(--f-display)}
.brand-sub{font-size:14px;opacity:.88}
.status-pill{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:700;background:var(--hero-chip)}
.status-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.status-pill.off::before{background:var(--tag)}
.greet{position:relative;margin-top:16px;font-size:15px;opacity:.9}
.hero-h{position:relative;font-size:24px;line-height:1.45;margin-top:2px;max-width:24ch}
.hero-cta{position:relative;display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-top:18px}
.hero-cta .btn{min-height:54px;padding-inline:12px;white-space:nowrap}
.hero-cta .main{background:#fff;color:#0A4F9E;border-color:transparent;box-shadow:0 8px 20px -8px rgba(0,0,0,.35)}
.hero-cta .alt{background:var(--hero-chip);color:var(--hero-ink);border-color:rgba(255,255,255,.28)}
.live-card{display:flex;flex-direction:column;gap:12px;text-align:start;width:100%}
.prog{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--brand),#38B2F2)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:start}
.cat b{display:block;font:700 15.5px var(--f-display)}
.cat span{font-size:13px;color:var(--muted)}
.gi{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:15px}
.gi.men{background:var(--t-men);color:var(--t-men-ink)}
.gi.women{background:var(--t-women);color:var(--t-women-ink)}
.gi.kids{background:var(--t-kids);color:var(--t-kids-ink)}
.gi.home{background:var(--t-home);color:var(--t-home-ink)}
.offer{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--tag-soft);border:1.5px dashed var(--tag-line)}
.offer b{font-family:var(--f-display)}
.offer .pct{font:800 26px/1 var(--f-display);color:var(--ink)}
.how{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:how}
.how li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:13.5px;font-weight:700;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.how .gi{width:42px;height:42px;border-radius:13px}
.facts{display:flex;flex-direction:column;margin:0;padding:0}
.facts div{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:11px;border-bottom:1px solid var(--line)}
.facts div:last-child{border-bottom:0}
.facts dt{font-size:13.5px;color:var(--muted);grid-column:2}
.facts dd{margin:0;font-size:15px;font-weight:700;grid-column:2}
.facts .fi{grid-row:1/3;color:var(--brand-text);padding-top:3px}
.legal{font-size:13px;color:var(--muted);line-height:1.75}
.legal button{text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:13px;min-height:32px}

/* paper tag order number */
.ticket{--hole:var(--bg);position:relative;display:flex;align-items:center;gap:14px;background:var(--tag);color:var(--tag-ink);border-radius:14px;padding:14px 16px;overflow:hidden;transform:rotate(-1deg)}
.ticket::before{content:"";width:15px;height:15px;border-radius:50%;background:var(--hole);flex:none;box-shadow:inset 0 0 0 2px var(--tag-line)}
.ticket .perf{align-self:stretch;border-inline-start:2px dashed var(--tag-line);margin-block:-14px}
.ticket .t-lab{font-size:12.5px;font-weight:800}
.ticket .t-num{font:700 32px/1.1 var(--f-display);letter-spacing:.03em}
.ticket .t-side{margin-inline-start:auto;text-align:end;font-size:13.5px;font-weight:800;line-height:1.5}
.ticket.mini{padding:10px 14px;gap:10px;transform:none}
.ticket.mini .t-num{font-size:22px}
.card .ticket{--hole:var(--surface)}
.tnum{font:700 14px/1 var(--f-display);background:var(--tag);color:var(--tag-ink);padding:6px 8px;border-radius:7px;flex:none}

/* catalog */
.sticky{position:sticky;top:0;z-index:3;background:var(--bg);padding-top:4px}
.search{position:relative}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-inline-start:44px;border-radius:999px;background:var(--surface)}
.tiles{list-style:none;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:6px 10px}
.tile{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:start;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tile.in{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.tile-name{font:700 15.5px/1.35 var(--f-display)}
.tile-note{font-size:12.5px;color:var(--muted);margin-top:-6px}
.tile-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;width:100%;gap:6px}
.from{font-size:13px;color:var(--muted)}
.from b{color:var(--ink);font-size:15.5px;font-weight:800}
.plus{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);font-size:20px;font-weight:800}

/* ---------- toasts ---------- */
function toast(which, text) {
  const layer = document.querySelector(`#dev-${which} .toasts`);
  if (!layer) return;
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 3400);
  while (layer.children.length > 2) layer.firstChild.remove();
}

function checkoutFoot() {

function cTrack() {
  const o = findOrder(S.cust.trackN);
  if (!o) return cOrders();
  const t = calc(o), flow = FLOW[o.method], hist = {};
  o.history.forEach(h => { hist[h.s] = h.t; });
  const stopped = o.status === 'rejected' || o.status === 'cancelled';
  const curIdx = stopped ? -1 : flow.indexOf(o.status);
  const tl = flow.map((s, i) => {
    const cls = stopped ? '' : i < curIdx || (i === curIdx && s === 'done') ? 'done' : i === curIdx ? 'cur' : '';
    const label = s === 'ready' && o.method === 'dropoff' ? L('جاهز للاستلام من المحل', 'Ready for collection') : stepName(s);
    return `<li class="${cls}" ${cls === 'cur' ? 'aria-current="step"' : ''}><span class="dotc" aria-hidden="true">${cls === 'done' ? IC.check(13) : ''}</span><span class="tl-name">${label}${cls === 'done' ? `<span class="sr"> (${L('تم', 'done')})</span>` : ''}</span><span class="tl-time">${hist[s] ? clock(hist[s]) : ''}</span></li>`;
  }).join('');
  const late = o.status === 'new' && Date.now() - o.created > LATE_MIN * MIN;
  const msgs = o.history.map(h => `<div class="wa-msg">${esc(waText(o, h.s))}<span class="wa-time">${clock(h.t)}</span></div>`).join('');
  const diff = o.paid && o.paidAmount != null && !awaitingCount(o) ? t.total - o.paidAmount : 0;
  const pct = progressOf(o);
  return `${backBar(L('تتبّع الطلب', 'Track order'), 'orders')}
  <div class="pad stack screen" style="padding-top:8px">
    <div class="ticket mini"><span><span class="t-lab">${L('رقم الطلب', 'Order no.')}</span><br><span class="t-num" dir="ltr">${o.n}</span></span><span class="perf"></span><span class="t-side">${o.method === 'pickup' ? L('استلام وتوصيل', 'Pickup & delivery') : L('تسليم في المحل', 'In-store drop-off')}<br>${o.speed === 'urgent' ? L('مستعجل', 'Express') : L('عادي', 'Standard')}</span></div>
    ${stopped ? `<div class="notice bad">${IC.alert(17)}<span>${o.status === 'rejected' ? `${L('اعتذرت المغسلة عن الطلب:', 'The laundry declined the order:')} ${esc(P(REASONS[o.rejectReason]))}.` : L('أُلغي هذا الطلب بناءً على طلبك.', 'This order was cancelled at your request.')}</span></div>` : `
    <div class="card status-card">
      <span class="small muted">${L('الحالة الآن', 'Status now')}</span>
      <span class="big">${statusLabel(o)}</span>
      <span class="prog" role="progressbar" aria-label="${L('تقدّم الطلب', 'Order progress')}" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(6, pct)}%"></i></span>
      ${o.slot && ['new', 'accepted'].includes(o.status) ? `<span class="small">${IC.clock(15)} ${L('موعد الاستلام:', 'Pickup:')} <b>${slotText(o)}</b></span>` : ''}
    </div>`}
    ${late ? `<div class="notice warn">${IC.clock(17)}<span>${L('لم تؤكد المغسلة طلبك بعد. واتساب المغسلة:', 'The laundry has not confirmed yet. WhatsApp:')} <span class="num" dir="ltr">${SHOP_PHONE}</span> (${L('رقم افتراضي', 'demo number')}).</span></div>` : ''}
    <div class="card"><h2 class="sec-title">${L('مراحل الطلب', 'Order steps')}</h2><ol class="tl">${tl}</ol></div>
    <div class="card"><h2 class="sec-title">${IC.receipt(18)} ${L('الفاتورة', 'Bill')}</h2>
      ${awaitingCount(o) ? `<p class="muted small" style="margin-bottom:10px">${L('سيتم جرد القطع عند الاستلام، وتظهر الفاتورة هنا وتصلك على واتساب.', 'Items are counted at pickup; the bill appears here and on WhatsApp.')}</p>${totalsHtml(t, { awaiting: true })}`
        : `<div style="margin-bottom:10px">${o.items.map(l => `<div class="line" style="padding-block:8px">${itemIcon(l.id, 'thumb sm')}<div class="line-main"><b>${esc(N(ITEMS[l.id]))} × <span class="num">${l.qty}</span></b><span>${svcName(l.svc)}</span></div><span class="line-sum">${money(priceOf(l) * l.qty)}</span></div>`).join('')}</div>
        ${totalsHtml(t, { method: o.method })}
        <p class="small" style="margin-top:10px">${o.paid ? `${L('مدفوع إلكترونيًا (محاكاة)', 'Paid online (simulated)')}${diff > 0 ? ` · ${L('المتبقي', 'balance due')} ${money(diff)}` : diff < 0 ? ` · ${L('يُعاد لك', 'refund')} ${money(-diff)}` : ''}` : L('الدفع عند التسليم', 'Pay on delivery')}</p>`}
    </div>
    <div class="card"><dl class="kv">
      <dt>${L('التسليم', 'Handover')}</dt><dd>${o.method === 'pickup' ? L('استلام وتوصيل', 'Pickup & delivery') : L('في المحل', 'In store')}</dd>
      ${o.slot ? `<dt>${L('الموعد', 'Time')}</dt><dd>${slotText(o)}</dd>` : ''}
      ${o.customer.district ? `<dt>${L('العنوان', 'Address')}</dt><dd>${esc(distName(o.customer.district))} · ${esc(o.customer.address)}</dd>` : ''}
      <dt>${L('المدة', 'Turnaround')}</dt><dd>${o.speed === 'urgent' ? L('مستعجل · 24 ساعة', 'Express · 24 h') : L('عادي · 48 ساعة', 'Standard · 48 h')}</dd>
      ${o.note ? `<dt>${L('ملاحظتك', 'Your note')}</dt><dd>${esc(o.note)}</dd>` : ''}
    </dl></div>
    <div class="grid2">
      <button class="btn" data-a="contact">${IC.chat(18)} ${L('راسل المغسلة', 'Message us')}</button>
      ${o.status === 'done' && o.items.length ? `<button class="btn primary" data-a="again" data-n="${o.n}">${IC.repeat(18)} ${L('أعد الطلب', 'Reorder')}</button>`
        : o.status === 'new' ? `<button class="btn danger" data-a="cancel" data-n="${o.n}">${ui.cancelArm === o.n ? L('اضغط للتأكيد', 'Tap to confirm') : L('إلغاء الطلب', 'Cancel order')}</button>` : '<span></span>'}
    </div>
    <details class="wa"><summary>${IC.chat(15)} ${L(`رسائل واتساب التي وصلت العميل (${o.history.length}) · محاكاة`, `WhatsApp messages sent (${o.history.length}) · simulated`)}</summary>${msgs}</details>
  </div>`;
}

function cSheet() {
  const sh = ui.sheetC;
  if (!sh) return '';
  if (sh.type === 'prefs') return prefsSheet('c');
  if (sh.type === 'pay') {
    const t = calc(cartDraft());
    return `<div class="sheet-wrap" data-a="closesheet" data-self="1"><div class="sheet pad" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="sh-title" tabindex="-1">${L('بوابة دفع تجريبية', 'Demo payment page')}</h2><button class="icon-btn" data-a="closesheet" aria-label="${L('إغلاق', 'Close')}">✕</button></div>
      <div class="notice warn">${IC.info(17)}<span>${L('هذه محاكاة: لا تُطلب بيانات بطاقة، ولا يُخصم أي مبلغ. في النسخة الفعلية تظهر هنا صفحة مزوّد الدفع المرخّص.', 'This is a simulation: no card details are asked and nothing is charged. The live version shows the licensed payment provider here.')}</span></div>
      <div class="totals"><div class="row total" style="border:0;padding:0"><span>${L('المبلغ', 'Amount')}</span><span>${money(t.total)}</span></div></div>
      <button class="btn primary wide" data-a="paydone">${L('إتمام الدفع التجريبي', 'Complete demo payment')}</button>
    </div></div>`;
  }
  const it = ITEMS[sh.id];
  const avail = Object.keys(it.prices).filter(k => !(k === 'dry' && !S.settings.dryClean));
  const inCart = S.cust.cart[`${sh.id}|${sh.svc}`];
  const price = sh.svc ? it.prices[sh.svc] : 0;
  return `<div class="sheet-wrap" data-a="closesheet" data-self="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="pad" style="display:flex;flex-direction:column;gap:16px">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><div class="sheet-title">${itemIcon(sh.id)}<div><h2 id="sh-title" tabindex="-1">${esc(N(it))}</h2>${it.note ? `<p class="muted small">${esc(P(it.note))}</p>` : ''}</div></div><button class="icon-btn" data-a="closesheet" aria-label="${L('إغلاق', 'Close')}">✕</button></div>
    <div role="radiogroup" aria-labelledby="svc-lbl"><div class="lbl" id="svc-lbl" style="margin-bottom:8px">${L('الخدمة', 'Service')}</div>
    <div class="opts">${Object.entries(it.prices).map(([k, p]) => {
      const off = k === 'dry' && !S.settings.dryClean;
      return `<label class="opt ${off ? 'is-off' : sh.svc === k ? 'is-on' : ''}"><input type="radio" name="svc" value="${k}" data-a="svc" ${sh.svc === k ? 'checked' : ''} ${off ? 'disabled' : ''}><span class="opt-main"><span class="opt-name">${svcName(k)}</span><span class="opt-sub">${off ? L('متوقف اليوم', 'Paused today') : P(SVC_NOTE[k])}</span></span><span class="opt-price">${off ? '—' : money(p)}</span></label>`;
    }).join('')}</div></div>
    ${avail.length ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span class="lbl" id="qty-lbl">${L('العدد', 'Quantity')}</span>
      <div class="stepper" role="group" aria-labelledby="qty-lbl"><button data-a="sq" data-d="1" aria-label="${L('زيادة العدد', 'Increase')}">+</button><output aria-live="polite">${sh.qty}</output><button data-a="sq" data-d="-1" aria-label="${L('إنقاص العدد', 'Decrease')}" ${sh.qty <= 1 ? 'disabled' : ''}>−</button></div></div>
      <button class="btn primary wide split" data-a="addcart"><span>${inCart ? L('تحديث السلة', 'Update basket') : L('أضف إلى السلة', 'Add to basket')}</span><span>${money(price * sh.qty)}</span></button>
      ${inCart ? `<button class="btn quiet wide" data-a="rmcart" style="color:var(--bad)">${L('إزالة من السلة', 'Remove from basket')}</button>` : ''}`
      : `<div class="notice warn">${IC.info(17)}<span>${L('هذه القطعة تحتاج تنظيفًا جافًا، والخدمة متوقفة اليوم. جرّب غدًا أو تواصل مع المغسلة.', 'This item needs dry cleaning, which is paused today. Try tomorrow or contact the laundry.')}</span></div>`}
    </div>
  </div></div>`;
}

function renderCustomer() {
  const c = S.cust, s = c.screen;
  let body = '', foot = '';
  if (s === 'catalog') {
    body = cCatalog();
    const t = calc(cartDraft());
    if (t.count) foot = `<div class="footbar pad"><button class="btn primary wide split" data-a="go" data-to="cart"><span>${L('عرض السلة', 'View basket')} · ${pcs(t.count)}</span><span>${money(t.sub)}</span></button></div>`;
  } else if (s === 'cart') {
    body = cCart();
    if (cartLines().length) foot = `<div class="footbar pad"><button class="btn primary wide" data-a="tocheckout">${L('التالي: الموعد والعنوان', 'Next: time & address')}</button></div>`;
  } else if (s === 'checkout') { body = cCheckout(); foot = checkoutFoot(); }
  else if (s === 'success') body = cSuccess();
  else if (s === 'track') body = cTrack();
  else if (s === 'orders') body = cOrders();
  else body = cHome();
  const tab = s === 'catalog' ? 'catalog' : s === 'cart' ? 'cart' : (s === 'orders' || s === 'track') ? 'orders' : 'home';
  const count = calc(cartDraft()).count;
  const tb = (to, ic, label, extra = '') => `<button data-a="go" data-to="${to}" ${tab === to ? 'aria-current="page"' : ''}><span class="t-ic">${IC[ic](21)}</span>${label}${extra}</button>`;
  const tabs = ['home', 'catalog', 'cart', 'orders', 'track'].includes(s) ? `<nav class="tabbar" aria-label="${L('التنقل الرئيسي', 'Main navigation')}">
    ${tb('home', 'home', L('الرئيسية', 'Home'))}${tb('catalog', 'list', L('الأسعار', 'Prices'))}${tb('cart', 'bag', L('السلة', 'Basket'), count ? `<span class="badge" aria-label="${pcs(count)}">${count}</span>` : '')}${tb('orders', 'receipt', L('طلباتي', 'Orders'))}
  </nav>` : '';
  paint('c', s + (s === 'track' ? c.trackN : '') + S.lang, `<div class="scroller">${body}</div>${foot}${tabs}${cSheet()}`);
}

/* ---------- owner screens ---------- */
function nextAction(o) {
  const pick = o.method === 'pickup';
  switch (o.status) {
    case 'new': return { label: L('قبول الطلب', 'Accept order'), to: 'accepted' };
    case 'accepted': return pick ? { label: L('المندوب في الطريق', 'Driver on the way'), to: 'picking' } : { label: L('استلمت القطع · جرد القطع', 'Items received · count'), count: true };
    case 'picking': return { label: L('تم الاستلام · جرد القطع', 'Collected · count items'), count: true };
    case 'counted': return { label: L('بدء الغسيل', 'Start washing'), to: 'cleaning' };
    case 'cleaning': return { label: L('الطلب جاهز', 'Mark ready'), to: 'ready' };
    case 'ready': return pick ? { label: L('خرج للتوصيل', 'Out for delivery'), to: 'delivering' } : { label: L('تم التسليم والتحصيل', 'Handed over & paid'), to: 'done' };
    case 'delivering': return { label: L('تم التسليم والتحصيل', 'Handed over & paid'), to: 'done' };
  }
  return null;
}
function oCard(o) {
  const t = calc(o), age = Math.floor((Date.now() - o.created) / MIN);
  const late = o.status === 'new' && age >= LATE_MIN, act = nextAction(o);
  const pick = o.method === 'pickup';
  return `<article class="ocard ${late ? 'is-late' : ''} ${ui.flash === o.n ? 'flash' : ''}" aria-label="${L('طلب', 'Order')} ${o.n} ${L('من', 'from')} ${esc(o.customer.name)}">
    <div class="ocard-top"><span class="tnum" dir="ltr">${o.n}</span><b>${esc(o.customer.name)}</b>${late ? `<span class="chip warn">${IC.clock(13)} ${L(`تأخر القبول ${age} د`, `Late to accept · ${age} min`)}</span>` : ''}<span class="ago" data-ago="${o.created}">${ago(o.created)}</span></div>
    <div class="meta">

const SIG_KEYS = ['a', 'id', 'n', 'k', 'v', 'to', 'd', 'i'];
function sigOf(el) {
  if (!el || !el.closest) return null;

  if (!el.dataset || !el.dataset.a) return null;
  return SIG_KEYS.filter(k => el.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join('')
    + (el.tagName === 'INPUT' ? `[value="${CSS.escape(el.value)}"]` : '');
}
function focusBySig(root, sig) {
  if (!sig) return false;

    return true;
  }

}

  const sc = view.querySelector('.scroller'), sameScreen = view.dataset.key === key, sameLang = (view.dataset.key || '').slice(-2) === key.slice(-2);
  const keep = sc && (sameScreen || !sameLang) ? sc.scrollTop : 0;
  const sheet = view.querySelector('.sheet'), sheetTop = sheet ? sheet.scrollTop : 0;
  view.innerHTML = html;
  view.dataset.key = key;
  const sc2 = view.querySelector('.scroller'); if (sc2) sc2.scrollTop = keep;
  const sh2 = view.querySelector('.sheet');
  [...view.children].forEach(ch => { if (!ch.classList.contains('sheet-wrap')) ch.inert = !!sh2; });
  if (sh2 && sheet) { sh2.classList.add('still'); sh2.scrollTop = sheetTop; }
  if (which === 'c' && ui.focusErr) {
    ui.focusErr = false;
    const bad = view.querySelector('[aria-invalid="true"], .slots[aria-describedby]');
    if (bad) { (bad.matches('.slots') ? bad.querySelector('button:not([disabled])') || bad : bad).focus(); return; }
  }
  if (sh2 && !sheet) { ui.opener[which] = focusSig; const h = sh2.querySelector('[tabindex="-1"]'); if (h) h.focus(); return; }
  if (!sh2 && sheet) { if (!focusBySig(view, ui.opener[which])) focusBySig(view, focusSig); return; }
  if (!inView) return;
  if (!sameScreen && sameLang && !sh2) { const h = view.querySelector('[data-focus]'); if (h) { h.focus({ preventScroll: true }); return; } }

}

    const sh = ui.sheetO, o = findOrder(sh.n);
    if (!sh.items.length) return;
    o.items = sh.items; o.counted = true; ui.sheetO = null;
    setStatus(o, 'counted');
    toast('o', L(`حُفظ الجرد: ${pcs(calc(o).count)} · أُرسلت الفاتورة للعميل (محاكاة)`, `Count saved: ${pcs(calc(o).count)} · bill sent (simulated)`));
    if (o.mine) toast('c', L(`تم جرد طلبك ${o.n}: ${moneyT(calc(o).total)}`, `Order #${o.n} counted: ${moneyT(calc(o).total)}`));
    return false;
  },
  closesheet: C.closesheet,
};

function trapTab(container, ev) {
  const f = [...container.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,summary,a[href],[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!container.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
  else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
}
function bind(which, map) {
  const dev = document.getElementById(`dev-${which}`);
  dev.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]');
    if (!el || !dev.contains(el)) return;
    const fn = map[el.dataset.a];
    if (!fn || el.tagName === 'LABEL') return;
    const res = fn(el.dataset, el, ev);
    if (res === false) return;
    save(); renderAll();
  });
  dev.addEventListener('keydown', ev => {
    if (ev.key !== 'Tab') return;
    const sheet = dev.querySelector('.sheet');
    if (sheet) trapTab(sheet, ev);
  });
  dev.addEventListener('input', ev => {
    const k = ev.target.dataset && ev.target.dataset.in;
    if (!k) return;
    S.cust[k] = ev.target.value;
    if (ui.errors[k]) {
      delete ui.errors[k];
      ev.target.removeAttribute('aria-invalid');
      const er = document.getElementById(`err-${k}`); if (er) er.remove();
    }
    save();
    if (k === 'district' || k === 'q') renderCustomer();
  });
}

function setView(v) {

}
