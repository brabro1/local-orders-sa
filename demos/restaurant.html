<title>نموذج مطعم سفرة الحارة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#231711">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Lalezar&display=swap">
<style>
/* Identity: a neighbourhood grill — charcoal and ember with saffron, Sadu-weave triangles, poster-style Lalezar headings.
   Every order number is printed on a saffron kitchen ticket with a torn edge (the number the cashier calls out).
   The restaurant side is a dark kitchen display (KDS), readable from a distance. */
:root{
  --bg:#FBF4EA; --surface:#FFFFFF; --sunk:#F5EADB; --ink:#2B1A10; --muted:#6E5747; --line:#EADBC8;
  --brand:#B23A12; --brand-ink:#FFFFFF; --brand-soft:#FBE3D5; --brand-text:#A3330E;
  --char:#231711; --char-2:#3A2519; --char-ink:#FBEFE0; --char-muted:#D9C3AE; --char-chip:rgba(255,255,255,.1);
  --saffron:#F2B233; --saffron-ink:#3A2600; --saffron-soft:#FCEFCB; --saffron-line:rgba(58,38,0,.32);
  --sadu-a:#9E2A1E; --sadu-b:#F2B233; --sadu-c:#FBEFE0;
  --live:#86DE9E; --busy:#F2B233;
  --ok:#1E7A4C; --ok-soft:#DCF2E4; --warn:#8C5000; --warn-soft:#FCEACB; --bad:#B02E26; --bad-soft:#FBE1DD; --on-bad:#FFFFFF;
  --wa-bg:#EAE4DA; --wa:#FFFFFF; --wa-ink:#1B2A26;
  --scrim:rgba(30,16,8,.55);
  --shadow:0 1px 2px rgba(43,26,16,.06),0 14px 32px rgba(43,26,16,.12);
  --shadow-sm:0 1px 3px rgba(43,26,16,.12);
  --f-display:"Lalezar","Almarai","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-body:"Almarai","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140E0A; --surface:#1F1610; --sunk:#1A120D; --ink:#F6EADB; --muted:#BAA390; --line:#3A2B20;
    --brand:#FF8A50; --brand-ink:#2A1205; --brand-soft:#45261A; --brand-text:#FFA174;
    --char:#0E0906; --char-2:#24170F; --char-ink:#FBEFE0; --char-muted:#CDB59F; --char-chip:rgba(255,255,255,.09);
    --saffron:#E8B53F; --saffron-ink:#2A1C00; --saffron-soft:#3D3115; --saffron-line:rgba(42,28,0,.45);
    --sadu-a:#B5382A; --sadu-b:#E8B53F; --sadu-c:#2B1D14;
    --ok:#52C48E; --ok-soft:#123426; --warn:#E9A443; --warn-soft:#3A2A10; --bad:#F07E76; --bad-soft:#3E1B19; --on-bad:#2A0B09;
    --wa-bg:#120D0A; --wa:#2A211B; --wa-ink:#F1E7DC;
    --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.45);
    --shadow-sm:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140E0A; --surface:#1F1610; --sunk:#1A120D; --ink:#F6EADB; --muted:#BAA390; --line:#3A2B20;
  --brand:#FF8A50; --brand-ink:#2A1205; --brand-soft:#45261A; --brand-text:#FFA174;
  --char:#0E0906; --char-2:#24170F; --char-ink:#FBEFE0; --char-muted:#CDB59F; --char-chip:rgba(255,255,255,.09);
  --saffron:#E8B53F; --saffron-ink:#2A1C00; --saffron-soft:#3D3115; --saffron-line:rgba(42,28,0,.45);
  --sadu-a:#B5382A; --sadu-b:#E8B53F; --sadu-c:#2B1D14;
  --ok:#52C48E; --ok-soft:#123426; --warn:#E9A443; --warn-soft:#3A2A10; --bad:#F07E76; --bad-soft:#3E1B19; --on-bad:#2A0B09;
  --wa-bg:#120D0A; --wa:#2A211B; --wa-ink:#F1E7DC;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 14px 32px rgba(0,0,0,.45);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
/* kitchen display: always dark, high contrast */
#dev-o{
  --bg:#110C09; --surface:#1C1410; --sunk:#160F0B; --ink:#F7ECDF; --muted:#BCA591; --line:#34261C;
  --brand:#FF8A50; --brand-ink:#2A1205; --brand-soft:#45261A; --brand-text:#FFA174;
  --ok:#5AD196; --ok-soft:#123426; --warn:#F2AE4E; --warn-soft:#3A2A10; --bad:#FF867D; --bad-soft:#3E1B19; --on-bad:#2A0B09;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px rgba(0,0,0,.5); --shadow-sm:0 1px 3px rgba(0,0,0,.45);
  color-scheme:dark; color:var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
:focus{outline:none}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
b,strong{font-weight:800}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column}

/* demo bar */
.demo-bar{flex:none;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:5}
.demo-tag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.demo-tag b{color:var(--ink)}
.demo-tag .dot{width:10px;height:10px;border-radius:50%;background:var(--saffron);flex:none;box-shadow:0 0 0 3px var(--saffron-soft)}
.demo-tag .long{display:none}
@media (min-width:640px){.demo-tag .long{display:inline}.demo-tag .short{display:none}}
.switch{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:3px}
.switch button{min-height:40px;border-radius:9px;font-weight:800;font-size:14.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.switch button[aria-selected="true"]{background:var(--char);color:var(--char-ink)}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--bad);color:var(--on-bad);font:800 12.5px/22px var(--f-body);text-align:center}
.ghost-btn{min-height:40px;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:14px;font-weight:800;background:var(--surface);white-space:nowrap}

/* stage */
.stage{flex:1;min-height:0;display:flex;justify-content:center}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.col.is-off{display:none}
.col-cap{display:none}
.device{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroller{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px}
@media (min-width:900px){
  .switch{display:none}
  .stage{gap:40px;padding:18px 24px 24px}
  .col,.col.is-off{display:flex;flex:none;width:400px;gap:8px}
  .col-cap{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted);padding-inline:10px}
  .col-cap b{color:var(--ink);font:400 18px var(--f-display)}
  .device{border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow);max-height:900px}
  #dev-o{border-color:#000}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:16px;border:1.5px solid var(--line);background:var(--surface);line-height:1.3}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.saffron{background:var(--saffron);color:var(--saffron-ink);border-color:transparent}
.btn.wide{width:100%}
.btn.split{justify-content:space-between}
.btn.sm{min-height:44px;padding:8px 14px;font-size:14.5px;border-radius:10px}
.btn.quiet{background:transparent;border-color:transparent;color:var(--brand-text)}
.btn.danger{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;min-height:42px;padding:6px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip-btn .cnt{font-size:12.5px;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:800;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand-text)}
.stack{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-title{font:400 19px/1.35 var(--f-display);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-head h2{font-size:22px}
.topbar{display:flex;align-items:center;gap:10px;padding-block:14px 6px}
.topbar h1{font-size:28px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);flex:none}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);flex:none}
.stepper button{width:40px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:800;color:var(--brand-text);border-radius:10px}
.stepper output{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:14.5px;font-weight:800}
.input{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:80px;resize:vertical}
.input:focus{border-color:var(--brand);outline:3px solid var(--brand-soft);outline-offset:0}
.input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13.5px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:var(--surface)}
.opt.is-on{border-color:var(--brand);background:var(--brand-soft)}
.opt input{accent-color:var(--brand);width:20px;height:20px;margin:0;flex:none}
.opt-main{display:flex;flex-direction:column;min-width:0}
.opt-name{font-weight:800}
.opt-sub{font-size:13.5px;color:var(--muted)}
.opt-price{margin-inline-start:auto;font-weight:800;white-space:nowrap;font-size:14.5px}
.opts{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:72px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);text-align:start}
.choice[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.choice b{font-size:15px;display:flex;align-items:center;gap:6px}
.choice span{font-size:13.5px;color:var(--muted)}
.choice:disabled{opacity:.5}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.time{min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:800;text-align:center}
.time[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.6;background:var(--sunk)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}
.notice svg{flex:none;margin-top:2px}
.totals{display:flex;flex-direction:column;gap:8px;font-size:15px}
.totals .row{display:flex;justify-content:space-between;gap:12px}
.totals .row.total{font-weight:800;font-size:18px;padding-top:10px;border-top:2px dotted var(--line);margin-top:2px}
.footbar{flex:none;padding-block:10px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.footbar .hint{font-size:13px;color:var(--muted);text-align:center}
.floatbar{flex:none;padding-block:8px 10px;background:linear-gradient(transparent,var(--bg) 40%)}
.cartbar{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:8px 10px 8px 16px;border-radius:16px;background:var(--char);color:var(--char-ink);box-shadow:var(--shadow);font-weight:800}
.cartbar .cnt{min-width:30px;height:30px;border-radius:9px;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;font-size:14.5px}
.cartbar .go{margin-inline-start:auto;display:flex;align-items:center;gap:6px;background:var(--brand);color:#fff;padding:8px 12px;border-radius:11px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--char);color:var(--char-muted);padding-block:6px max(8px,env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:12.5px;font-weight:800;padding:4px}
.tabbar button[aria-current="page"]{color:var(--saffron)}
.steps{list-style:none;margin:0;padding:6px 0 0;display:flex;gap:6px}
.steps li{flex:1;display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:800;color:var(--muted)}
.steps li::before{content:"";height:5px;border-radius:2px;background:var(--line)}
.steps li.done::before,.steps li.cur::before{background:var(--brand)}
.steps li.cur{color:var(--ink)}

/* sadu weave band */
.sadu{height:14px;background:
  linear-gradient(135deg,var(--sadu-a) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(225deg,var(--sadu-a) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(315deg,var(--sadu-b) 25%,transparent 25%) 7px 7px/14px 14px,
  linear-gradient(45deg,var(--sadu-b) 25%,transparent 25%) 7px 7px/14px 14px,var(--sadu-c)}

/* customer: home */
.hero{background:radial-gradient(120% 90% at 100% 0,var(--char-2),var(--char) 60%);color:var(--char-ink);padding-block:18px 20px}
.brand-row{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:50%;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px rgba(242,178,51,.22)}
.brand-name{font:400 30px/1.15 var(--f-display)}
.brand-sub{font-size:13.5px;color:var(--char-muted)}
.status-pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 12px;border-radius:8px;font-size:13.5px;font-weight:800;background:var(--char-chip)}
.status-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.status-pill.busy::before{background:var(--busy)}
.status-pill.off::before{background:#FF867D}
.hero-h{font-size:30px;margin-top:12px;max-width:16ch}
.hero-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:var(--char-chip)}
.hero-seg button{min-height:56px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:var(--char-muted);line-height:1.35}
.hero-seg button small{font-size:12px;font-weight:700}
.hero-seg button[aria-pressed="true"]{background:var(--char-ink);color:var(--char)}
.hero-seg button:disabled{opacity:.45}
.hero .btn.saffron{margin-top:12px;min-height:54px}
.pop{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-16px;padding-inline:16px}
.pop::-webkit-scrollbar{display:none}
.pcard{flex:none;width:150px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.pcard .open{display:flex;flex-direction:column;text-align:start}
.pcard .ft{height:96px;border-radius:0}
.pcard .pc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.pcard .pc-name{font-weight:800;font-size:15px}
.pcard .pc-price{font-weight:800;color:var(--brand-text)}
.pcard .addbtn{position:absolute;top:64px;inset-inline-end:8px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.catb{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;text-align:center;min-height:44px}
.catb .ft{width:56px;height:56px;border-radius:16px}
.direct{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--saffron-soft);border:2px dashed var(--saffron-line)}
.direct b{font-family:var(--f-display);font-weight:400;font-size:19px}
.facts{display:flex;flex-direction:column;margin:0;padding:0}
.facts div{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-block:11px;border-bottom:1px dotted var(--line)}
.facts div:last-child{border-bottom:0}
.facts dt{font-size:13.5px;color:var(--muted);grid-column:2}
.facts dd{margin:0;font-size:15px;font-weight:800;grid-column:2}
.facts .fi{grid-row:1/3;color:var(--brand-text);padding-top:3px}
.legal{font-size:13px;color:var(--muted);line-height:1.8}
.legal button{text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:13px;min-height:32px}

/* food tiles */
.ft{display:grid;place-items:center;flex:none;color:#fff;border-radius:14px;position:relative;overflow:hidden}
.ft::after{content:"";position:absolute;inset:auto -20% -40% auto;width:80%;height:80%;border-radius:50%;background:rgba(255,255,255,.12)}
.ft svg{position:relative;z-index:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.ft.grill{background:linear-gradient(145deg,#E8693A,#A8320F)}
.ft.rice{background:linear-gradient(145deg,#F2B233,#B86A08)}
.ft.sand{background:linear-gradient(145deg,#D98B4E,#8F4A20)}
.ft.starters{background:linear-gradient(145deg,#6FAF7A,#2B6236)}
.ft.drinks{background:linear-gradient(145deg,#3C9A9A,#1B5660)}
.ft.out{filter:grayscale(1) opacity(.55)}

/* kitchen ticket with torn edge */
.ticket{position:relative;display:flex;align-items:center;gap:14px;background:var(--saffron);color:var(--saffron-ink);border-radius:10px 10px 0 0;padding:14px 16px 22px;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/16px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,#0000 97%,#000) 50% 0/16px 100% repeat-x}
.ticket .perf{align-self:stretch;border-inline-start:2px dashed var(--saffron-line);margin-block:-14px -22px}
.ticket .t-lab{font-size:12.5px;font-weight:800}
.ticket .t-num{font:400 38px/1 var(--f-display);letter-spacing:.02em}
.ticket .t-side{margin-inline-start:auto;text-align:end;font-size:13.5px;font-weight:800;line-height:1.55}
.ticket.mini{padding:10px 14px 18px;gap:10px}
.ticket.mini .perf{margin-block:-10px -18px}
.ticket.mini .t-num{font-size:28px}
.tnum{font:400 17px/1 var(--f-display);background:var(--saffron);color:var(--saffron-ink);padding:6px 8px 4px;border-radius:6px;flex:none}

/* menu */
.sticky{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid var(--line)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--sunk);border:1.5px solid var(--line);border-radius:12px;padding:3px;margin-inline-start:auto}

function toast(which, text) {

  const el = document.createElement('div');

  while (layer.children.length > 2) layer.firstChild.remove();
}
let actx = null;
function ding() {
  if (!S.settings.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    [880, 1175].forEach((f, i) => {
      const osc = actx.createOscillator(), g = actx.createGain(), at = t0 + i * 0.18;
      osc.type = 'sine'; osc.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.16, at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.16);
      osc.connect(g).connect(actx.destination); osc.start(at); osc.stop(at + 0.18);
    });
  } catch (e) { /* sound is optional */ }
}

    <div class="wa"><div class="wa-head"><span>${IC.chat(15)} ${L('مثال على رسالة واتساب للعميل', 'Sample WhatsApp message')}</span><span>${L('محاكاة', 'Simulated')}</span></div>
      <div class="wa-msg">${esc(waText(o, o.history[0]))}<span class="wa-time">${clock(o.created)}</span></div></div>

function etaCard(o) {
  if (o.status === 'new') return `<div class="card eta"><div><div class="eta-l">${o.when === 'at' ? L('الموعد المطلوب', 'Requested time') : L('وقت التجهيز', 'Ready time')}</div><div class="eta-t">${o.when === 'at' ? clock(o.at) : L('قريبًا', 'Soon')}</div></div><span class="chip warn">${L('بانتظار القبول', 'Awaiting acceptance')}</span></div>`;
  if (o.status === 'preparing') {
    const t = customerEta(o);
    return `<div class="card eta" role="status"><div><div class="eta-l">${o.method === 'delivery' ? L('يصلك تقريبًا', 'Arrives around') : L('جاهز تقريبًا', 'Ready around')}</div><div class="eta-t" dir="ltr">${clock(t)}</div><div class="eta-in" data-eta="${t}">${minsLeft(t)}</div></div><span style="color:var(--saffron)">${IC.flame(44)}</span></div>`;
  }
  if (o.status === 'ready' && o.pickupMode === 'car') return o.arrived
    ? `<div class="notice ok">${IC.car(17)}<span>${L('أبلغنا المطعم بوصولك، والطلب في الطريق لسيارتك', 'The restaurant knows you are here; your order is on its way to your car')} (${esc(o.customer.car)}).</span></div>`
    : `<button class="btn primary wide split" data-a="arrived" data-n="${o.n}" style="min-height:60px"><span>${IC.car(20)} ${L('وصلت للمطعم', 'I’m here')}</span><span class="small" style="font-weight:700">${esc(o.customer.car)}</span></button>`;
  if (o.status === 'ready') return `<div class="notice ok">${IC.store(17)}<span>${L(`طلبك جاهز عند الكاشير. اذكر الرقم ${o.n}.`, `Your order is ready at the counter. Give number ${o.n}.`)}</span></div>`;
  return '';

function cTrack() {
  const o = findOrder(S.cust.trackN);
  if (!o) return cOrders();
  const t = calc(o), flow = FLOW[o.method], hist = {};
  o.history.forEach(h => { if (!hist[h.s]) hist[h.s] = h.t; });
  const stopped = o.status === 'rejected' || o.status === 'cancelled';
  const curIdx = stopped ? -1 : flow.indexOf(o.status);
  const tl = flow.map((s, i) => {
    const cls = stopped ? '' : i < curIdx || (i === curIdx && s === 'done') ? 'done' : i === curIdx ? 'cur' : '';
    const label = { new: L('استلمنا طلبك', 'Order received'), preparing: L('قيد التحضير', 'Being prepared'), ready: L('جاهز للاستلام', 'Ready for pickup'), delivering: L('خرج للتوصيل', 'Out for delivery'), done: statusLabel(o, 'done') }[s];
    return `<li class="${cls}" ${cls === 'cur' ? 'aria-current="step"' : ''}><span class="dotc" aria-hidden="true">${cls === 'done' ? IC.check(13) : ''}</span><span class="tl-name">${label}${cls === 'done' ? `<span class="sr"> (${L('تم', 'done')})</span>` : ''}</span><span class="tl-time">${hist[s] ? clock(hist[s]) : ''}</span></li>`;
  }).join('');
  const late = o.status === 'new' && Date.now() - o.created > LATE_MIN * MIN;
  const msgs = o.history.map(h => `<div class="wa-msg">${esc(waText(o, h))}<span class="wa-time">${clock(h.t)}</span></div>`).join('');
  const diff = o.paid && o.paidAmount != null ? t.total - o.paidAmount : 0;
  return `${backBar(L('تتبّع الطلب', 'Track order'), 'orders')}
  <div class="pad stack screen" style="padding-top:8px">
    <div class="ticket mini"><span><span class="t-lab">${L('رقم الطلب', 'Order no.')}</span><br><span class="t-num" dir="ltr">${o.n}</span></span><span class="perf"></span><span class="t-side">${statusLabel(o)}</span></div>
    ${o.issue && !finished(o) ? issueBlock(o) : ''}
    ${stopped ? `<div class="notice bad">${IC.alert(17)}<span>${o.status === 'rejected' ? `${L('اعتذر المطعم عن الطلب:', 'The restaurant declined the order:')} ${esc(P(REASONS[o.rejectReason]))}.` : o.cancelReason ? L('أُلغي الطلب لأنه لم يبقَ فيه أصناف متوفرة.', 'Cancelled because no available items were left.') : L('أُلغي هذا الطلب بناءً على طلبك.', 'This order was cancelled at your request.')}</span></div>` : etaCard(o)}
    ${late ? `<div class="notice warn">${IC.clock(17)}<span>${L('لم يؤكد المطعم طلبك بعد. اتصل بالمطعم:', 'The restaurant has not confirmed yet. Call:')} <span class="num" dir="ltr">${SHOP_PHONE}</span> (${L('رقم افتراضي', 'demo number')}).</span></div>` : ''}
    <div class="card"><h2 class="sec-title">${L('مراحل الطلب', 'Order steps')}</h2><ol class="tl">${tl}</ol></div>
    <div class="card"><h2 class="sec-title">${IC.receipt(19)} ${L('الفاتورة', 'Bill')}</h2>
      <div style="margin-bottom:10px">${o.lines.map(l => {
        const op = optsText(l);
        return `<div class="line ${l.removed ? 'rm' : ''}" style="padding-block:8px">${ft(l.id, 'sm')}<div class="line-main"><b>${esc(N(ITEMS[l.id]))} × <span class="num">${l.qty}</span></b>${op ? `<span>${esc(op)}</span>` : ''}${l.from ? `<span>${L('بديل عن', 'Replaces')} ${esc(N(ITEMS[l.from]))}</span>` : ''}${l.removed ? `<span>${L('حُذف · غير متوفر', 'Removed · unavailable')}</span>` : ''}</div><span class="line-sum">${money(unitPrice(l) * l.qty)}</span></div>`;
      }).join('')}</div>
      ${totalsHtml(t, { method: o.method, district: o.customer.district })}
      <p class="small" style="margin-top:10px">${o.paid ? `${L('مدفوع إلكترونيًا (محاكاة)', 'Paid online (simulated)')}${diff < 0 ? ` · ${L('يُعاد لك', 'refund')} ${money(-diff)}` : diff > 0 ? ` · ${L('المتبقي عند الاستلام', 'due at pickup')} ${money(diff)}` : ''}` : L('الدفع عند الاستلام', 'Pay on pickup / delivery')}</p>
    </div>
    <div class="card"><dl class="kv">
      <dt>${L('الطريقة', 'Type')}</dt><dd>${o.method === 'delivery' ? L('توصيل', 'Delivery') : o.pickupMode === 'car' ? `${L('استلام لسيارتك', 'Pickup to your car')} · ${esc(o.customer.car)}` : L('استلام من الكاشير', 'Counter pickup')}</dd>
      <dt>${L('الوقت', 'Time')}</dt><dd>${o.when === 'at' ? clock(o.at) : L('أقرب وقت', 'ASAP')}</dd>
      ${o.customer.district ? `<dt>${L('العنوان', 'Address')}</dt><dd>${esc(distName(o.customer.district))} · ${esc(o.customer.address)}</dd>` : ''}
      ${o.note ? `<dt>${L('ملاحظتك', 'Your note')}</dt><dd>${esc(o.note)}</dd>` : ''}
    </dl></div>
    <div class="grid2">
      <button class="btn" data-a="contact">${IC.chat(18)} ${L('اتصل بالمطعم', 'Call us')}</button>
      ${o.status === 'done' ? `<button class="btn primary" data-a="again" data-n="${o.n}">${IC.repeat(18)} ${L('أعد الطلب', 'Reorder')}</button>`
        : o.status === 'new' ? `<button class="btn danger" data-a="cancel" data-n="${o.n}">${ui.cancelArm === o.n ? L('اضغط للتأكيد', 'Tap to confirm') : L('إلغاء الطلب', 'Cancel order')}</button>` : '<span></span>'}
    </div>
    <details class="wa"><summary>${IC.chat(15)} ${L(`رسائل واتساب التي وصلت العميل (${o.history.length}) · محاكاة`, `WhatsApp messages sent (${o.history.length}) · simulated`)}</summary>${msgs}</details>
  </div>`;
}

function cOrders() {
  const list = myOrders();
  return `<div class="pad topbar"><h1 tabindex="-1" data-focus style="flex:1">${L('طلباتي', 'My orders')}</h1>${gearBtn()}</div>
  <div class="pad screen">${list.length ? `<ul class="olist">${list.map(o => `<li class="orow">
      <button class="open" data-a="track" data-n="${o.n}">
        <span class="tnum" dir="ltr">${o.n}</span>
        <span class="orow-main"><b>${statusLabel(o)}${o.issue && !finished(o) ? ` · ${L('يحتاج ردك', 'needs your reply')}` : ''}</b><span>${o.method === 'delivery' ? L('توصيل', 'Delivery') : L('استلام', 'Pickup')} · ${o.when === 'at' ? clock(o.at) : clock(o.created)} · ${money(calc(o).total)}</span></span>
        ${IC.fwd(18)}</button>
      ${o.status === 'done' ? `<button class="icon-btn" data-a="again" data-n="${o.n}" aria-label="${L('أعد الطلب', 'Reorder')} ${o.n}">${IC.repeat(18)}</button>` : ''}
    </li>`).join('')}</ul>`
    : `<div class="empty">${iconTile('rice', 'receipt')}<b>${L('لا توجد طلبات بعد', 'No orders yet')}</b><span>${L('جرّب طلبًا الآن، وسيظهر هنا مع حالته ورسائله.', 'Place one now and it will show here with its status and messages.')}</span><button class="btn primary sm" data-a="go" data-to="menu">${L('ابدأ طلبًا', 'Start an order')}</button></div>`}</div>`;
}

function cSheet() {
  const sh = ui.sheetC;
  if (!sh) return '';
  if (sh.type === 'prefs') return prefsSheet('c');
  if (sh.type === 'pay') {
    const t = calc(cartDraft());
    return `<div class="sheet-wrap" data-a="closesheet" data-self="1"><div class="sheet pad" role="dialog" aria-modal="true" aria-labelledby="sh-title">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="sh-title" tabindex="-1">${L('بوابة دفع تجريبية', 'Demo payment page')}</h2><button class="icon-btn" data-a="closesheet" aria-label="${L('إغلاق', 'Close')}">✕</button></div>
      <div class="notice warn">${IC.info(17)}<span>${L('هذه محاكاة: لا تُطلب بيانات بطاقة، ولا يُخصم أي مبلغ. في النسخة الفعلية تظهر هنا صفحة مزوّد الدفع المرخّص.', 'This is a simulation: no card details are asked and nothing is charged. The live version shows the licensed payment provider here.')}</span></div>
      <div class="totals"><div class="row total" style="border:0;padding:0"><span>${L('المبلغ', 'Amount')}</span><span>${money(t.total)}</span></div></div>
      <button class="btn primary wide" data-a="paydone">${L('إتمام الدفع التجريبي', 'Complete demo payment')}</button>
    </div></div>`;
  }
  const it = ITEMS[sh.id];
  const groups = groupsOf(it).map(g => `<fieldset class="og"><legend>${P(g.name)}<span>${g.one ? L('اختر واحدًا', 'Choose one') : L('اختياري', 'Optional')}</span></legend>
    <div class="ochips">${g.ch.map(c => {
      const on = g.one ? sh.opts[g.id] === c.id : sh.opts[g.id].includes(c.id);
      const extra = [c.p ? `+${moneyT(c.p)}` : '', c.cal ? `${c.cal > 0 ? '+' : '−'}${Math.abs(c.cal)} ${L('سعرة', 'kcal')}` : ''].filter(Boolean).join(' · ');
      return `<label class="ochip ${g.id === 'no' ? 'no' : ''} ${on ? 'is-on' : ''}"><input type="${g.one ? 'radio' : 'checkbox'}" name="g-${g.id}" value="${c.id}" data-a="opt" data-g="${g.id}" ${on ? 'checked' : ''}>${g.id === 'no' ? `${L('بدون', 'No')} ` : ''}${esc(N(c))}${extra ? `<small dir="auto">${extra}</small>` : ''}</label>`;
    }).join('')}</div></fieldset>`).join('');
  return `<div class="sheet-wrap" data-a="closesheet" data-self="1"><div class="sheet has-hero" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    ${ft(sh.id, 'ihero')}
    <button class="icon-btn close-over" data-a="closesheet" aria-label="${L('إغلاق', 'Close')}">✕</button>
    <div class="pad" style="display:flex;flex-direction:column;gap:16px">
      <div><h2 id="sh-title" tabindex="-1" style="font-size:28px">${esc(N(it))}</h2>${it.desc ? `<p class="muted">${esc(P(it.desc))}</p>` : ''}</div>
      <div class="kcal"><span>${L('السعرات الحرارية للواحد', 'Calories per item')}</span><b>${kcal(unitCal(sh))}</b></div>
      ${groups}
      <div class="field"><label for="s-note">${L('ملاحظة على الصنف (اختياري)', 'Item note (optional)')}</label><input class="input" id="s-note" data-in="sheetnote" type="text" maxlength="80" placeholder="${L('مثال: الصوص على جنب', 'e.g. sauce on the side')}" value="${esc(sh.note)}"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="stepper" role="group" aria-label="${L('الكمية', 'Quantity')}"><button data-a="sq" data-d="1" aria-label="${L('زيادة الكمية', 'Increase')}">+</button><output aria-live="polite">${sh.qty}</output><button data-a="sq" data-d="-1" aria-label="${L('إنقاص الكمية', 'Decrease')}" ${sh.qty <= 1 ? 'disabled' : ''}>−</button></div>
        <button class="btn primary split" style="flex:1" data-a="addcart"><span>${sh.uid ? L('تحديث السلة', 'Update basket') : L('أضف إلى السلة', 'Add to basket')}</span><span>${money(unitPrice(sh) * sh.qty)}</span></button>
      </div>
      ${sh.uid ? `<button class="btn quiet wide" data-a="rmcart" style="color:var(--bad)">${L('إزالة من السلة', 'Remove from basket')}</button>` : ''}
    </div>
  </div></div>`;
}

function renderCustomer() {
  const c = S.cust, s = c.screen;
  let body = '', foot = '';
  const t = calc(cartDraft());
  const cartbar = `<div class="floatbar pad"><button class="cartbar" data-a="go" data-to="cart"><span class="cnt" aria-hidden="true">${t.count}</span><span>${L('السلة', 'Basket')} · ${units(t.count)}</span><span class="go">${money(t.sub)} ${IC.fwd(16)}</span></button></div>`;
  if (s === 'menu') { body = cMenu(); if (t.count) foot = cartbar; }
  else if (s === 'cart') {
    body = cCart();
    const blocked = c.cart.some(l => S.soldOut[l.id]);
    if (c.cart.length) foot = `<div class="footbar pad">${blocked ? `<span class="hint">${L('احذف الأصناف التي نفدت للمتابعة', 'Remove sold-out items to continue')}</span>` : ''}<button class="btn primary wide" data-a="tocheckout" ${blocked ? 'disabled' : ''}>${L('التالي: الاستلام والدفع', 'Next: pickup & payment')}</button></div>`;
  } else if (s === 'checkout') { body = cCheckout(); foot = checkoutFoot(); }
  else if (s === 'success') body = cSuccess();
  else if (s === 'track') body = cTrack();
  else if (s === 'orders') body = cOrders();
  else { body = cHome(); if (t.count) foot = cartbar; }
  const tab = s === 'menu' ? 'menu' : (s === 'orders' || s === 'track') ? 'orders' : 'home';
  const tb = (to, ic, label) => `<button data-a="go" data-to="${to}" ${tab === to ? 'aria-current="page"' : ''}>${IC[ic](22)}${label}</button>`;
  const tabs = ['home', 'menu', 'orders', 'track'].includes(s) ? `<nav class="tabbar" aria-label="${L('التنقل الرئيسي', 'Main navigation')}">${tb('home', 'home', L('الرئيسية', 'Home'))}${tb('menu', 'menu', L('القائمة', 'Menu'))}${tb('orders', 'receipt', L('طلباتي', 'Orders'))}</nav>` : '';
  paint('c', s + (s === 'track' ? c.trackN : '') + S.lang, `<div class="scroller">${body}</div>${foot}${tabs}${cSheet()}`);
  const view = document.querySelector('#dev-c .view'), sc = view.querySelector('.scroller');
  if (s === 'menu' && sc) {
    if (ui.jump) { const sec = view.querySelector(`#sec-${ui.jump}`); if (sec) sc.scrollTop = sec.offsetTop - 64; ui.jump = null; }
    sc.addEventListener('scroll', () => {
      let cur = MENU[0].id;
      MENU.forEach(m => { const sec = view.querySelector(`#sec-${m.id}`); if (sec && sec.offsetTop - sc.scrollTop <= 90) cur = m.id; });
      if (cur !== S.cust.cat) { S.cust.cat = cur; view.querySelectorAll('.sticky .chip-btn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === cur))); }
    }, { passive: true });
  }
}

/* ---------- owner screens: kitchen display ---------- */
function nextAction(o) {
  switch (o.status) {
    case 'preparing': return o.method === 'pickup' ? { label: L('الطلب جاهز', 'Order ready'), to: 'ready' } : { label: L('خرج للتوصيل', 'Out for delivery'), to: 'delivering' };
    case 'ready': return { label: L('تم الاستلام والتحصيل', 'Collected & paid'), to: 'done' };
    case 'delivering': return { label: L('تم التوصيل والتحصيل', 'Delivered & paid'), to: 'done' };
  }
  return null;
}
function oCard(o) {
  const t = calc(o), age = Math.floor((Date.now() - o.created) / MIN);
  const late = o.status === 'new' && age >= LATE_MIN, act = nextAction(o);
  const del = o.method === 'delivery', here = o.status === 'ready' && o.arrived;
  const canIssue = (o.status === 'new' || o.status === 'preparing') && !o.issue;
  const lines = o.lines.map(l => {
    const op = optsText(l);
    return `<li class="${l.removed ? 'rm' : ''}"><span class="q">${l.qty}</span><span><span class="k-name">${esc(N(ITEMS[l.id]))}</span>${l.removed ? ` <span class="chip bad">${L('حُذف', 'Removed')}</span>` : ''}${l.from ? ` <span class="chip brand">${L('بديل عن', 'replaces')} ${esc(N(ITEMS[l.from]))}</span>` : ''}${op ? `<span class="k-opt">${esc(op)}</span>` : ''}${l.note ? `<span class="k-note">${L('ملاحظة:', 'Note:')} ${esc(l.note)}</span>` : ''}</span></li>`;
  }).join('');
  let actions = '';
  if (o.issue && !finished(o)) {
    const line = o.lines[o.issue.i];
    actions = `<div class="notice warn">${IC.clock(17)}<span>${L(`بانتظار رد العميل على «${esc(N(ITEMS[line.id]))}» · يُحذف تلقائيًا بعد`, `Waiting for the customer on “${esc(N(ITEMS[line.id]))}” · auto-removed in`)} <b class="num" data-cd="${o.issue.deadline}">${mmss(o.issue.deadline - Date.now())}</b></span></div>
      <div class="ocard-actions"><button class="btn sm" data-a="idefault" data-n="${o.n}">${L('احذف الصنف الآن', 'Remove item now')}</button></div>`;
  }
  if (o.status === 'new') {
    const pm = S.settings.busy ? [30, 35, 45, 60] : [15, 20, 30, 45];
    actions += o.when === 'at'
      ? `<div class="ocard-actions"><button class="btn primary sm" data-a="accept" data-n="${o.n}">${L('قبول', 'Accept')} · ${del ? L('يصل', 'arrives') : L('جاهز', 'ready')} ${clock(o.at)}</button></div>`
      : `<div role="group" aria-label="${L(`قبول الطلب ${o.n} بمدة تحضير`, `Accept order ${o.n} with prep time`)}"><div class="small muted" style="margin-bottom:6px;font-weight:800">${L('قبول بمدة تحضير:', 'Accept with prep time:')}</div><div class="prep-row">${pm.map(m => `<button class="btn ${m === prepNow() ? 'primary' : ''}" data-a="accept" data-n="${o.n}" data-m="${m}" aria-label="${L(`قبول بمدة ${m} دقيقة`, `Accept, ${m} minutes`)}">${L(`${m} د`, `${m}m`)}</button>`).join('')}</div></div>`;
    actions += `<div class="ocard-actions">${canIssue ? `<button class="btn sm" data-a="unavail" data-n="${o.n}">${L('صنف غير متوفر', 'Item unavailable')}</button>` : ''}<button class="btn sm" data-a="reject" data-n="${o.n}" aria-expanded="${ui.rejecting === o.n}">${L('اعتذار', 'Decline')}</button></div>`;
  } else if (act && !o.issue) {
    actions += `<div class="ocard-actions"><button class="btn primary" data-a="adv" data-n="${o.n}">${act.label}</button>${canIssue ? `<button class="btn sm" data-a="unavail" data-n="${o.n}">${L('صنف غير متوفر', 'Item unavailable')}</button>` : ''}</div>`;
  }
  const who = del ? `${IC.truck(14)} ${L('توصيل', 'Delivery')} · ${esc(distName(o.customer.district))}` : o.pickupMode === 'car' ? `${IC.car(14)} ${L('للسيارة', 'Car')} · ${esc(o.customer.car)}` : `${IC.store(14)} ${L('من الكاشير', 'Counter')}`;
  return `<article class="kt ${late ? 'is-late' : ''} ${here ? 'is-here' : ''} ${ui.flash === o.n ? 'flash' : ''}" aria-label="${L('طلب', 'Order')} ${o.n} ${L('من', 'from')} ${esc(o.customer.name)}${late ? L('، تأخر القبول', ', late to accept') : ''}">
    <div class="kt-top"><span class="kt-num" dir="ltr">${o.n}</span><span class="kt-who"><b>${esc(o.customer.name)}</b><span>${who}</span></span><span class="kt-age" data-ago="${o.created}">${ago(o.created)}</span></div>
    <div class="kt-body">
      <div class="meta">
        <span class="chip">${IC.clock(13)} ${o.when === 'at' ? `${L('مجدول', 'Scheduled')} ${clock(o.at)}` : L('أقرب وقت', 'ASAP')}</span>
        ${o.status === 'preparing' && o.readyAt ? `<span class="chip brand">${L('جاهز', 'Ready')} ${clock(o.readyAt)}</span>` : ''}
        ${late ? `<span class="chip bad">${L(`تأخر القبول ${age} د`, `Late · ${age} min`)}</span>` : ''}
        ${here ? `<span class="chip ok">${IC.car(13)} ${L('العميل وصل', 'Customer is here')}</span>` : ''}
        ${statusChip(o)}
      </div>
      <ul class="klist">${lines}</ul>
      ${o.note ? `<div class="ocard-note">${L('ملاحظة العميل:', 'Customer note:')} ${esc(o.note)}</div>` : ''}
      ${del && o.customer.address ? `<div class="small muted">${IC.pin(13)} ${esc(o.customer.address)}</div>` : ''}
      <div class="ocard-foot"><span><b>${money(t.total)}</b> · ${o.paid ? L('مدفوع إلكترونيًا (محاكاة)', 'paid online (simulated)') : L('الدفع عند الاستلام', 'pay on collection')}</span></div>
      ${o.status === 'rejected' ? `<div class="small muted">${L('سبب الاعتذار:', 'Reason:')} ${esc(P(REASONS[o.rejectReason]))}</div>` : ''}
      ${actions}
      ${ui.rejecting === o.n ? `<div role="group" aria-label="${L('سبب الاعتذار', 'Decline reason')}"><div class="small muted" style="margin-bottom:6px">${L('اختر سبب الاعتذار (يصل للعميل):', 'Choose a reason (sent to the customer):')}</div><div class="reasons">${REASONS.map((r, i) => `<button class="chip-btn" data-a="rreason" data-n="${o.n}" data-i="${i}">${P(r)}</button>`).join('')}</div></div>` : ''}
    </div>
  </article>`;
}
function oMenu() {
  return `<div class="notice">${IC.info(17)}<span>${L('الصنف الذي توقفه يظهر للعميل «نفد اليوم» فورًا ولا يستطيع طلبه. في النسخة الفعلية يعود تلقائيًا في اليوم التالي.', 'A paused item shows as “sold out today” to customers right away. In the live version it comes back automatically the next day.')}</span></div>
  ${MENU.map(c => `<div class="card" style="padding-block:4px"><h2 class="sec-title" style="margin:10px 0 2px">${N(c)}</h2>${c.items.map(it => {
    const out = !!S.soldOut[it.id];
    return `<div class="set-row ${out ? 'is-out' : ''}"><div><b id="av-${it.id}">${esc(N(it))}</b><p>${money(it.price)} · ${kcal(it.cal)}</p></div>
      <button class="toggle" role="switch" aria-checked="${!out}" data-a="avail" data-id="${it.id}" aria-labelledby="av-${it.id} avs-${it.id}"><span id="avs-${it.id}">${out ? L('نفد اليوم', 'Sold out') : L('متوفر', 'Available')}</span><span class="knob"></span></button></div>`;
  }).join('')}</div>`).join('')}`;
}
function oSettings() {

/* ---------- paint: keeps scroll, restores focus, manages dialogs ---------- */
const SIG_KEYS = ['a', 'id', 'n', 'u', 'k', 'v', 'to', 'd', 'g', 'i', 'm'];
function sigOf(el) {
  if (!el || !el.closest) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  if (!el.dataset || !el.dataset.a) return null;
  return SIG_KEYS.filter(k => el.dataset[k] != null).map(k => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join('')
    + (el.tagName === 'INPUT' ? `[value="${CSS.escape(el.value)}"]` : '');
}
function focusBySig(root, sig) {
  if (!sig) return false;
  const el = root.querySelector(sig);
  if (el && !el.disabled) {
    el.focus({ preventScroll: true });
    if (el.type === 'text') { const n = el.value.length; el.setSelectionRange(n, n); }
    return true;
  }
  return false;
}
function paint(which, key, html) {
  const dev = document.getElementById(`dev-${which}`), view = dev.querySelector('.view');
  const active = document.activeElement, inView = view.contains(active);
  const focusSig = inView ? sigOf(active) : null;
  const sc = view.querySelector('.scroller'), sameScreen = view.dataset.key === key, sameLang = (view.dataset.key || '').slice(-2) === key.slice(-2);
  const keep = sc && (sameScreen || !sameLang) ? sc.scrollTop : 0;
  const sheet = view.querySelector('.sheet'), sheetTop = sheet ? sheet.scrollTop : 0;
  view.innerHTML = html;
  view.dataset.key = key;
  const sc2 = view.querySelector('.scroller'); if (sc2) sc2.scrollTop = keep;
  const sh2 = view.querySelector('.sheet');
  [...view.children].forEach(ch => { if (!ch.classList.contains('sheet-wrap')) ch.inert = !!sh2; });
  if (sh2 && sheet) { sh2.classList.add('still'); sh2.scrollTop = sheetTop; }
  if (which === 'c' && ui.focusErr) {
    ui.focusErr = false;
    const bad = view.querySelector('[aria-invalid="true"], .times[aria-describedby]');
    if (bad) { (bad.matches('.times') ? bad.querySelector('button') : bad).focus(); return; }
  }
  if (sh2 && !sheet) { ui.opener[which] = focusSig; const h = sh2.querySelector('[tabindex="-1"]'); if (h) h.focus(); return; }
  if (!sh2 && sheet) { if (!focusBySig(view, ui.opener[which])) focusBySig(view, focusSig); return; }
  if (!inView) return;
  if (!sameScreen && sameLang && !sh2) { const h = view.querySelector('[data-focus]'); if (h) { h.focus({ preventScroll: true }); return; } }
  focusBySig(view, focusSig);
}
function badge() {
  const n = S.orders.filter(o => o.status === 'new').length, b = document.getElementById('sw-badge');
  b.textContent = n; b.hidden = !n;
  b.setAttribute('aria-label', L(`${n} طلبات جديدة`, `${n} new orders`));
}
function renderAll() { renderCustomer(); renderOwner(); badge(); }

/* ---------- actions ---------- */
function setStatus(o, s) {
  o.status = s; o.history.push({ s, t: Date.now() });
  if (finished(o)) o.issue = null;
  save(); renderAll();
}
function validate() {
  const c = S.cust, e = {}, del = c.method === 'delivery', t = calc(cartDraft());
  if (!S.settings.open) e.time = L('المطعم مغلق الآن.', 'The restaurant is closed.');
  else if (c.when === 'asap' && isPaused()) e.time = L('الطلبات الفورية متوقفة مؤقتًا. اختر وقتًا محددًا.', 'ASAP orders are paused. Choose a time.');
  else if (c.when === 'at' && (!c.at || c.at < timeOptions(c.method)[0])) e.time = L('اختر وقت الطلب.', 'Choose a time.');
  if (del) {
    if (!S.settings.delivery) e.method = L('التوصيل متوقف اليوم. اختر الاستلام من المطعم.', 'Delivery is off today. Choose pickup.');
    if (!c.district) e.district = L('اختر الحي.', 'Choose your area.');
    else if (c.district === 'other') e.district = L('هذا الحي خارج نطاق التوصيل.', 'That area is outside our delivery zone.');
    if (!c.address.trim()) e.address = L('اكتب وصفًا مختصرًا للعنوان.', 'Add a short address description.');
    if (t.sub < MIN_DELIVERY) e.min = L('الحد الأدنى للتوصيل.', 'Delivery minimum.');
  } else if (c.pickupMode === 'car' && !c.car.trim()) e.car = L('اكتب نوع السيارة ولونها.', 'Enter your car model and colour.');
  if (c.name.trim().length < 2) e.name = L('اكتب اسمك.', 'Enter your name.');
  if (!/^05\d{8}$/.test(normPhone(c.phone))) e.phone = L('رقم سعودي يبدأ بـ 05 ومن 10 أرقام.', 'A Saudi number: 10 digits starting with 05.');
  return e;
}
function placeOrder(paid) {
  const c = S.cust, n = ++S.seq, del = c.method === 'delivery';
  const o = {
    n, created: Date.now(), mine: true,
    customer: { name: c.name.trim(), phone: normPhone(c.phone), district: del ? c.district : '', address: del ? c.address.trim() : '', car: !del && c.pickupMode === 'car' ? c.car.trim() : '' },
    method: c.method, pickupMode: del ? 'counter' : c.pickupMode, when: c.when, at: c.when === 'at' ? c.at : null,
    lines: c.cart.map(l => ({ id: l.id, qty: l.qty, opts: JSON.parse(JSON.stringify(l.opts)), note: l.note })),
    pay: c.pay, paid: !!paid, note: c.note.trim(), issue: null, prepMin: null, readyAt: null, arrived: false,
    status: 'new', history: [{ s: 'new', t: Date.now() }],
  };
  if (paid) o.paidAmount = calc(o).total;
  S.orders.unshift(o);
  Object.assign(c, { cart: [], note: '', at: null, located: false, screen: 'success', trackN: n });
  ui.sheetC = null; ui.errors = {}; ui.flash = n;
  if (!['menu', 'settings'].includes(S.own.tab)) S.own.tab = 'new';
  save(); renderAll();
  ding();
  toast('o', L(`طلب جديد ${n} من ${o.customer.name}`, `New order #${n} from ${o.customer.name}`));
  setTimeout(() => { if (ui.flash === n) { ui.flash = null; renderOwner(); } }, 3200);
}
function resolveIssue(o, choice, by) {
  const is = o.issue;
  if (!is) return;
  const line = o.lines[is.i], itemId = line.id;
  const swap = choice === 'swap' && is.alt && ITEMS[is.alt];
  if (swap) o.lines[is.i] = { id: is.alt, qty: line.qty, opts: carryOpts(line, is.alt), note: '', from: line.id };
  else line.removed = true;
  o.issue = null;
  const t = calc(o);
  o.history.push({ s: 'resolved', t: Date.now(), x: { swap: !!swap, by, item: itemId, alt: swap ? is.alt : null, total: t.total, diff: o.paid && o.paidAmount != null ? t.total - o.paidAmount : 0 } });
  if (!o.lines.some(live)) { o.cancelReason = true; o.status = 'cancelled'; o.history.push({ s: 'cancelled', t: Date.now() }); }
  save(); renderAll();
}
function addLine(line) {
  const cart = S.cust.cart, same = cart.find(x => sig(x) === sig(line));
  if (same) same.qty = Math.min(50, same.qty + line.qty); else cart.push(line);
}

const C = {
  ...PREFS,
  prefs() { ui.sheetC = { type: 'prefs' }; },
  go(d) { S.cust.screen = d.to; ui.errors = {}; ui.cancelArm = null; },
  jump(d) { S.cust.cat = d.id; ui.jump = d.id; S.cust.screen = 'menu'; },
  item(d) {
    if (S.soldOut[d.id]) { toast('c', L(`${N(ITEMS[d.id])} نفد اليوم، جرّب صنفًا آخر`, `${N(ITEMS[d.id])} is sold out today`)); return false; }
    ui.sheetC = { type: 'item', id: d.id, qty: 1, opts: defaultOpts(d.id), note: '' };
  },
  qadd(d) {
    if (S.soldOut[d.id]) return false;
    addLine({ uid: uid(), id: d.id, qty: 1, opts: defaultOpts(d.id), note: '' });
    toast('c', `${L('أُضيف:', 'Added:')} ${N(ITEMS[d.id])}`);
  },
  edit(d) {
    const l = S.cust.cart.find(x => x.uid === d.u);
    if (l) ui.sheetC = { type: 'item', id: l.id, qty: l.qty, opts: JSON.parse(JSON.stringify(l.opts)), note: l.note, uid: l.uid };
  },
  opt(d, el) {
    const sh = ui.sheetC, g = groupsOf(ITEMS[sh.id]).find(x => x.id === d.g);
    if (g.one) sh.opts[g.id] = el.value;
    else sh.opts[g.id] = el.checked ? [...new Set([...sh.opts[g.id], el.value])] : sh.opts[g.id].filter(v => v !== el.value);
  },
  sq(d) { const sh = ui.sheetC; sh.qty = Math.max(1, Math.min(50, sh.qty + Number(d.d))); },
  addcart() {
    const sh = ui.sheetC, cart = S.cust.cart;
    const line = { uid: sh.uid || uid(), id: sh.id, qty: sh.qty, opts: sh.opts, note: (sh.note || '').trim() };
    if (sh.uid) cart.splice(cart.findIndex(x => x.uid === sh.uid), 1, line); else addLine(line);
    ui.sheetC = null;
    toast('c', `${sh.uid ? L('تم التحديث:', 'Updated:') : L('أُضيف:', 'Added:')} ${N(ITEMS[sh.id])} × ${sh.qty}`);
  },
  rmcart() { const sh = ui.sheetC; S.cust.cart = S.cust.cart.filter(x => x.uid !== sh.uid); ui.sheetC = null; toast('c', `${L('أُزيل:', 'Removed:')} ${N(ITEMS[sh.id])}`); },
  closesheet(d, el, ev) { if (d.self && ev.target !== el) return false; ui.sheetC = null; ui.sheetO = null; },
  line(d) {
    const l = S.cust.cart.find(x => x.uid === d.u);
    if (!l) return;
    l.qty += Number(d.d);
    if (l.qty <= 0) { S.cust.cart = S.cust.cart.filter(x => x !== l); toast('c', `${L('أُزيل:', 'Removed:')} ${N(ITEMS[l.id])}`); } else l.qty = Math.min(50, l.qty);
  },
  method(d) {
    if (d.v === 'delivery' && !S.settings.delivery) { toast('c', L('التوصيل متوقف اليوم', 'Delivery is off today')); return false; }
    S.cust.method = d.v; S.cust.at = null; ui.errors = {};
  },
  pmode(d) { S.cust.pickupMode = d.v; delete ui.errors.car; },
  when(d) { S.cust.when = d.v; delete ui.errors.time; },
  at(d) { S.cust.at = Number(d.v); delete ui.errors.time; },
  locate() { S.cust.located = true; toast('c', L('تم تحديد الموقع (محاكاة)', 'Location set (simulated)')); },
  pay(d, el) { S.cust.pay = el.value; },
  tocheckout() {
    if (S.cust.cart.some(l => S.soldOut[l.id])) return false;
    S.cust.screen = 'checkout'; ui.errors = {};
    if (!S.settings.open || isPaused()) S.cust.when = 'at';
    if (S.cust.method === 'delivery' && !S.settings.delivery) S.cust.method = 'pickup';
  },
  confirm() {
    ui.errors = validate();
    if (Object.keys(ui.errors).length) { ui.focusErr = true; toast('c', L('راجع الحقول المطلوبة', 'Check the required fields')); return; }
    if (S.cust.pay === 'online') { ui.sheetC = { type: 'pay' }; return; }
    placeOrder(false); return false;
  },
  paydone() { placeOrder(true); return false; },
  track(d) { S.cust.trackN = Number(d.n); S.cust.screen = 'track'; ui.cancelArm = null; },
  again(d) {
    const o = findOrder(Number(d.n)); if (!o) return;
    let skipped = 0;
    S.cust.cart = [];
    o.lines.filter(live).forEach(l => { if (S.soldOut[l.id]) { skipped++; return; } addLine({ uid: uid(), id: l.id, qty: l.qty, opts: JSON.parse(JSON.stringify(l.opts)), note: l.note || '' }); });
    S.cust.screen = 'cart';
    toast('c', skipped ? L('أُضيف الطلب، عدا أصناف نفدت اليوم', 'Added, except items sold out today') : L('أُضيفت أصناف الطلب السابق إلى السلة', 'Your previous items are in the basket'));
  },
  contact() { toast('c', L('يتصل بالمطعم في النسخة الفعلية', 'Calls the restaurant in the live version')); return false; },
  cancel(d) {
    const n = Number(d.n);
    if (ui.cancelArm !== n) { ui.cancelArm = n; return; }
    ui.cancelArm = null; const o = findOrder(n);
    if (o && o.status === 'new') { setStatus(o, 'cancelled'); toast('o', L(`ألغى العميل الطلب ${n}`, `Customer cancelled order #${n}`)); }
    return false;
  },
  iswap(d) {
    const o = findOrder(Number(d.n)); if (!o || !o.issue) return false;
    const alt = N(ITEMS[o.issue.alt]);
    resolveIssue(o, 'swap', 'customer');
    toast('c', L(`تم الاستبدال بـ ${alt}`, `Swapped for ${alt}`)); toast('o', L(`طلب ${o.n}: اختار العميل ${alt} بديلًا`, `Order #${o.n}: customer chose ${alt}`));
    return false;
  },
  iremove(d) {
    const o = findOrder(Number(d.n)); if (!o || !o.issue) return false;
    resolveIssue(o, 'remove', 'customer');
    toast('c', L('حُذف الصنف وعُدّل الإجمالي', 'Item removed, total updated')); toast('o', L(`طلب ${o.n}: اختار العميل حذف الصنف`, `Order #${o.n}: customer removed the item`));
    return false;
  },
  arrived(d) {
    const o = findOrder(Number(d.n)); if (!o || o.arrived) return false;
    o.arrived = true; o.history.push({ s: 'arrived', t: Date.now() }); ui.flash = o.n;
    save(); renderAll(); ding();
    toast('o', L(`وصل ${o.customer.name} · ${o.customer.car} · طلب ${o.n}`, `${o.customer.name} is here · ${o.customer.car} · order #${o.n}`));
    setTimeout(() => { if (ui.flash === o.n) { ui.flash = null; renderOwner(); } }, 3200);
    return false;
  },
  soon() { toast('c', L('تظهر هذه الصفحة في النسخة الفعلية', 'This page is part of the live version')); return false; },
};
const O = {
  ...PREFS,
  prefs() { ui.sheetO = { type: 'prefs' }; },
  otab(d) { S.own.tab = d.v; ui.rejecting = null; },
  toggle(d) {
    const k = d.k; S.settings[k] = !S.settings[k];
    const on = S.settings[k];
    const msg = { open: on ? L('عاد استقبال الطلبات', 'Taking orders again') : L('أُوقف استقبال الطلبات', 'Orders stopped'), busy: on ? L(`وضع الزحمة: التجهيز ≈ ${prepNow()} دقيقة`, `Busy mode: ready in ≈ ${prepNow()} min`) : L(`عادت مدة التجهيز ${PREP} دقيقة`, `Prep time back to ${PREP} min`), delivery: on ? L('عاد التوصيل', 'Delivery back on') : L('أُوقف التوصيل، والاستلام متاح', 'Delivery off; pickup still open'), sound: on ? L('التنبيه الصوتي يعمل', 'Sound on') : L('أُوقف التنبيه الصوتي', 'Sound off') }[k];
    if (k === 'delivery' && !on && S.cust.method === 'delivery' && S.cust.screen !== 'track') S.cust.method = 'pickup';
    toast('o', k === 'sound' ? msg : `${msg} · ${L('ظهر التغيير للعميل', 'customers see it now')}`);
    if (k === 'sound' && on) ding();
  },
  pause() { S.settings.pausedUntil = Date.now() + PAUSE_MIN * MIN; if (S.cust.when === 'asap') S.cust.when = 'at'; toast('o', L(`أُوقفت الطلبات الفورية حتى ${clock(S.settings.pausedUntil)}`, `ASAP orders paused until ${clock(S.settings.pausedUntil)}`)); },
  resume() { S.settings.pausedUntil = 0; toast('o', L('عاد استقبال الطلبات الفورية', 'ASAP orders resumed')); },
  avail(d) {
    S.soldOut[d.id] = !S.soldOut[d.id];
    toast('o', S.soldOut[d.id] ? L(`${N(ITEMS[d.id])}: نفد اليوم · لا يستطيع العملاء طلبه`, `${N(ITEMS[d.id])}: sold out today`) : L(`${N(ITEMS[d.id])} عاد للقائمة`, `${N(ITEMS[d.id])} is back on the menu`));
  },
  accept(d) {
    const o = findOrder(Number(d.n)); if (!o || o.status !== 'new') return false;
    if (o.when === 'at') { o.readyAt = o.method === 'delivery' ? o.at - DRIVE * MIN : o.at; o.prepMin = null; }
    else { o.prepMin = Number(d.m); o.readyAt = Date.now() + o.prepMin * MIN; }
    setStatus(o, 'preparing');
    toast('o', L(`قُبل الطلب ${o.n} · جاهز ${clock(o.readyAt)} · أُرسل واتساب للعميل (محاكاة)`, `Order #${o.n} accepted · ready ${clock(o.readyAt)} · WhatsApp sent (simulated)`));
    if (o.mine) toast('c', L(`قبل المطعم طلبك ${o.n}`, `The restaurant accepted order #${o.n}`));
    return false;
  },
  adv(d) {
    const o = findOrder(Number(d.n)), act = o && nextAction(o);
    if (!act || o.issue) return;
    setStatus(o, act.to);
    toast('o', `${statusLabel(o)} · ${L('أُرسل إشعار واتساب للعميل (محاكاة)', 'WhatsApp update sent (simulated)')}`);
    if (o.mine) toast('c', L(`تحديث على طلبك ${o.n}: ${statusLabel(o)}`, `Update on order #${o.n}: ${statusLabel(o)}`));
    return false;
  },
  reject(d) { const n = Number(d.n); ui.rejecting = ui.rejecting === n ? null : n; },
  rreason(d) {
    const o = findOrder(Number(d.n)); if (!o) return;
    o.rejectReason = Number(d.i); ui.rejecting = null;
    setStatus(o, 'rejected');
    toast('o', L('أُرسل الاعتذار وسببه للعميل (محاكاة)', 'Decline and reason sent (simulated)'));
    if (o.mine) toast('c', L(`تعذّر قبول طلبك ${o.n}`, `Order #${o.n} was declined`));
    return false;
  },
  unavail(d) {
    const o = findOrder(Number(d.n)); if (!o) return;
    const i = o.lines.findIndex(live);
    if (i < 0) return;
    ui.sheetO = { type: 'issue', n: o.n, i, alt: suggestAlt(o.lines[i].id), stop: true };
  },
  iline(d, el) { const sh = ui.sheetO, o = findOrder(sh.n); sh.i = Number(el.value); sh.alt = suggestAlt(o.lines[sh.i].id); },
  istop(d, el) { ui.sheetO.stop = el.checked; },
  isend() {
    const sh = ui.sheetO, o = findOrder(sh.n), line = o.lines[sh.i];
    const altLine = sh.alt ? { id: sh.alt, qty: line.qty, opts: carryOpts(line, sh.alt) } : null;
    o.issue = { i: sh.i, alt: sh.alt, deadline: Date.now() + ISSUE_MIN * MIN };
    o.history.push({ s: 'issue', t: Date.now(), x: { item: line.id, alt: altLine ? sh.alt : null, altPrice: altLine ? unitPrice(altLine) * line.qty : 0 } });
    if (sh.stop) S.soldOut[line.id] = true;
    ui.sheetO = null;
    save(); renderAll();
    toast('o', L(`أُرسل للعميل: ${N(ITEMS[line.id])} غير متوفر (محاكاة واتساب)`, `Sent to customer: ${N(ITEMS[line.id])} unavailable (simulated)`));
    if (o.mine) toast('c', L(`طلبك ${o.n} يحتاج ردك: صنف غير متوفر`, `Order #${o.n} needs your reply: an item is unavailable`));
    return false;
  },
  idefault(d) {
    const o = findOrder(Number(d.n)); if (!o || !o.issue) return false;
    resolveIssue(o, 'remove', 'auto');
    toast('o', L(`حُذف الصنف من طلب ${o.n} وعُدّل الإجمالي`, `Item removed from order #${o.n}, total updated`));
    if (o.mine) toast('c', L(`حُذف صنف غير متوفر من طلبك ${o.n}`, `An unavailable item was removed from order #${o.n}`));
    return false;
  },
  closesheet: C.closesheet,
};

const INPUTS = {
  sheetnote: v => { if (ui.sheetC) ui.sheetC.note = v; },
  ialt: v => { if (ui.sheetO) ui.sheetO.alt = v || null; },
};
function trapTab(container, ev) {
  const f = [...container.querySelectorAll('button:not([disabled]),input:not([disabled]),select,textarea,summary,a[href],[tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null || el.type === 'radio' || el.type === 'checkbox');
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!container.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
  else if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
  else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
}
function bind(which, map) {
  const dev = document.getElementById(`dev-${which}`);
  dev.addEventListener('click', ev => {
    const el = ev.target.closest('[data-a]');
    if (!el || !dev.contains(el)) return;
    const fn = map[el.dataset.a];
    if (!fn || el.tagName === 'LABEL') return;
    const res = fn(el.dataset, el, ev);
    if (res === false) return;
    save(); renderAll();
  });
  dev.addEventListener('keydown', ev => {
    if (ev.key !== 'Tab') return;
    const sheet = dev.querySelector('.sheet');
    if (sheet) trapTab(sheet, ev);
  });
  dev.addEventListener('input', ev => {
    const k = ev.target.dataset && ev.target.dataset.in;
    if (!k) return;
    if (INPUTS[k]) { INPUTS[k](ev.target.value); return; }
    S.cust[k] = ev.target.value;
    if (ui.errors[k]) {
      delete ui.errors[k];
      ev.target.removeAttribute('aria-invalid');
      const er = document.getElementById(`err-${k}`); if (er) er.remove();
    }
    save();
    if (k === 'district') renderCustomer();
  });
}
bind('c', C);
bind('o', O);

/* ---------- demo bar + settings panel (page chrome) ---------- */
const colC = document.getElementById('col-c'), colO = document.getElementById('col-o');
const swC = document.getElementById('sw-customer'), swO = document.getElementById('sw-owner');
const panel = document.getElementById('settings'), openBtn = document.getElementById('open-settings');
function renderChrome() {
  document.getElementById('demo-tag-text').innerHTML = `<b>${L('نسخة عرض', 'Demo')}</b><span class="long"> · ${L('القائمة والأسعار والسعرات افتراضية، ولا تُرسل طلبات أو مدفوعات حقيقية', 'sample menu, prices and calories; no real orders or payments are sent')}</span><span class="short"> · ${L('بيانات وأسعار افتراضية', 'sample data')}</span>`;
  openBtn.textContent = L('إعدادات العرض', 'Demo settings');
  document.getElementById('switch').setAttribute('aria-label', L('تبديل الواجهة', 'Switch view'));
  swC.firstElementChild.textContent = L('تطبيق العميل', 'Customer app');
  swO.firstElementChild.textContent = L('شاشة المطبخ', 'Kitchen display');
  const caps = [[colC, L('تطبيق العميل', 'Customer app'), L('من الجوال أو رمز QR', 'on the phone or via QR')], [colO, L('شاشة المطبخ', 'Kitchen display'), L('على جهاز الكاشير أو تابلت المطبخ', 'on the counter or kitchen tablet')]];
  caps.forEach(([col, a, b]) => { const cap = col.querySelector('.col-cap'); cap.children[0].textContent = a; cap.children[1].textContent = b; col.querySelector('.device').setAttribute('aria-label', a); });
  panel.querySelector('.panel').innerHTML = `
    <div class="sheet-head"><h2 id="set-title" tabindex="-1">${L('إعدادات العرض', 'Demo settings')}</h2><button class="icon-btn" data-p="close" type="button" aria-label="${L('إغلاق', 'Close')}">✕</button></div>
    <div class="field">
      <label for="shop-name">${L('اسم المطعم الذي يظهر في النموذج', 'Restaurant name shown in the demo')}</label>
      <input class="input" id="shop-name" type="text" maxlength="40" autocomplete="off" aria-describedby="shop-name-hint">
      <span class="muted small" id="shop-name-hint">${L('اكتب اسم المطعم الذي تزوره ليرى صاحبه اسمه داخل التطبيق.', 'Type the name of the restaurant you are visiting so the owner sees it in the app.')}</span>
    </div>
    <div><h3>${L('سيناريو عرض سريع', 'Quick demo script')}</h3><ol>
      <li>${L('اكتب اسم المطعم هنا، ثم أغلق النافذة.', 'Type the restaurant name here, then close this window.')}</li>
      <li>${L('في «تطبيق العميل»: اختر «استلام»، ثم من «رز ومندي» اطلب مندي دجاج حبة كاملة برز بخاري، وأضف شاي كرك كبير.', 'In the customer app: choose Pickup; from “Rice & mandi” order a whole chicken mandi with bukhari rice, and add a large karak.')}</li>
      <li>${L('أكمل الطلب واختر «لسيارتك». انتقل إلى «شاشة المطبخ»: الطلب يرن في «جديدة». اقبله بمدة 20 دقيقة.', 'Check out with “To your car”. On the kitchen display the order chimes under “New”. Accept it with 20 minutes.')}</li>
      <li>${L('اضغط «صنف غير متوفر»، اختر الكرك واقترح شاي عدني. ارجع لتطبيق العميل واختر الاستبدال، وشاهد الفاتورة تتعدل.', 'Tap “Item unavailable”, pick the karak and suggest Adeni tea. In the customer app choose the swap and watch the bill change.')}</li>
      <li>${L('من «الأصناف» أوقف صنفًا، ومن «التشغيل» فعّل وضع الزحمة، وشاهد أثرهما على العميل فورًا.', 'Under “Items” mark something sold out; under “Operations” turn on busy mode; see both on the customer side at once.')}</li>
    </ol></div>
    <div><h3>${L('يعمل فعليًا داخل النموذج', 'Works in this demo')}</h3><ul>
      <li>${L('الأقسام والسعرات وتخصيص الوجبة والإضافة السريعة، وحساب الإجمالي ورسوم التوصيل.', 'Categories, calories, meal options, quick add, totals and delivery fees.')}</li>
      <li>${L('الاستلام من الكاشير أو السيارة، والتوصيل، والطلب لوقت محدد.', 'Counter or car pickup, delivery, and scheduled orders.')}</li>
      <li>${L('وصول الطلب لشاشة المطبخ بتنبيه صوتي، والقبول بمدة تحضير، وتحديث الحالة.', 'Orders reach the kitchen display with a chime; accept with a prep time; update status.')}</li>
      <li>${L('الصنف غير المتوفر قبل الطلب وبعده: استبدال أو حذف، وتعديل الفاتورة، والحذف التلقائي بعد 5 دقائق.', 'Unavailable items before and after ordering: swap or remove, bill updates, auto-remove after 5 minutes.')}</li>
      <li>${L('العربية والإنجليزية، والوضع الفاتح والداكن لتطبيق العميل.', 'Arabic and English; light and dark mode for the customer app.')}</li>
    </ul></div>
    <div><h3>${L('محاكاة فقط', 'Simulated only')}</h3><ul>
      <li>${L('رسائل واتساب والاتصال: معاينة فقط، لا يُرسل شيء.', 'WhatsApp and calls: preview only, nothing is sent.')}</li>
      <li>${L('الدفع الإلكتروني: لا توجد بوابة ولا يُخصم أي مبلغ.', 'Online payment: no gateway, nothing is charged.')}</li>
      <li>${L('تحديد الموقع على الخريطة.', 'Map location.')}</li>
      <li>${L('الربط بين جهازين: البيانات محفوظة في هذا المتصفح فقط.', 'Two devices: data lives in this browser only.')}</li>
    </ul></div>
    <details><summary style="cursor:pointer;font-weight:800;min-height:36px">${L('مصادر الصور (ويكيميديا كومنز)', 'Photo credits (Wikimedia Commons)')}</summary>
      <ul class="credits">${PHOTO_CREDITS.map(([k, title, artist, lic, url]) => `<li><a href="${url}" target="_blank" rel="noopener">${esc(title)}</a> · ${esc(artist || L('مجهول', 'unknown'))} · ${esc(lic)}</li>`).join('')}</ul>
      <p class="muted small">${L('صور توضيحية بتراخيص مفتوحة، وقد قُصّت لتناسب التطبيق، ولا تمثّل أطباق المطعم الفعلية. رمز الريال من البنك المركزي السعودي.', 'Openly licensed illustrative photos, cropped to fit; they are not this restaurant’s actual dishes. Riyal symbol by the Saudi Central Bank.')}</p></details>
    <button class="btn danger wide" data-p="reset" type="button">${L('إعادة ضبط العرض', 'Reset demo')}</button>`;
}
function setView(v) {
  ui.view = v;
  colC.classList.toggle('is-off', v !== 'customer');
  colO.classList.toggle('is-off', v !== 'owner');
  swC.setAttribute('aria-selected', String(v === 'customer'));
  swO.setAttribute('aria-selected', String(v === 'owner'));
  try { sessionStorage.setItem(LS_KEY + ':view', v); } catch (e) { /* optional */ }
}
swC.addEventListener('click', () => setView('customer'));
swO.addEventListener('click', () => setView('owner'));
try { const v = sessionStorage.getItem(LS_KEY + ':view'); if (v === 'owner') setView('owner'); } catch (e) { /* optional */ }

const closePanel = () => { panel.hidden = true; openBtn.focus(); };
openBtn.addEventListener('click', () => { panel.hidden = false; document.getElementById('shop-name').value = S.shopName; document.getElementById('set-title').focus(); });
let resetArm = null;
panel.addEventListener('click', ev => {
  if (ev.target === panel) { closePanel(); return; }
  const b = ev.target.closest('[data-p]');
  if (!b) return;
  if (b.dataset.p === 'close') { closePanel(); return; }
  if (!resetArm) {
    b.textContent = L('اضغط مرة أخرى لتأكيد إعادة الضبط', 'Tap again to confirm reset');
    resetArm = setTimeout(() => { resetArm = null; b.textContent = L('إعادة ضبط العرض', 'Reset demo'); }, 4000);
    return;
  }
  clearTimeout(resetArm); resetArm = null; b.textContent = L('إعادة ضبط العرض', 'Reset demo');
  S = freshState(S.shopName, S.lang, S.theme); Object.assign(ui, { sheetC: null, sheetO: null, errors: {}, rejecting: null, cancelArm: null, flash: null });
  save(); renderAll(); closePanel(); setView('customer');
  toast('c', L('أُعيد ضبط العرض', 'Demo reset'));
});
panel.addEventListener('input', ev => { if (ev.target.id === 'shop-name') { S.shopName = ev.target.value.trim() || DEFAULT_NAME; save(); renderAll(); } });
panel.addEventListener('keydown', ev => { if (ev.key === 'Tab') trapTab(panel.querySelector('.panel'), ev); });
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape') return;
  if (!panel.hidden) { closePanel(); return; }
  if (ui.sheetC || ui.sheetO) { ui.sheetC = null; ui.sheetO = null; renderAll(); }
});

/* every second: countdowns, kitchen clock; issue deadlines and pauses expire here */
setInterval(() => {
  const now = Date.now();
  S.orders.filter(o => o.issue && o.issue.deadline <= now).forEach(o => {
    resolveIssue(o, 'remove', 'auto');
    toast('o', L(`انتهت مهلة الرد على طلب ${o.n} · حُذف الصنف تلقائيًا`, `No reply on order #${o.n} · item removed automatically`));
    if (o.mine) toast('c', L(`حُذف صنف غير متوفر من طلبك ${o.n}`, `An unavailable item was removed from order #${o.n}`));
  });
  if (S.settings.pausedUntil && S.settings.pausedUntil <= now) {
    S.settings.pausedUntil = 0; save(); renderAll();
    toast('o', L('انتهى الإيقاف المؤقت · عاد استقبال الطلبات', 'Pause ended · taking orders again'));
  }
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = mmss(Number(el.dataset.cd) - now); });
  const ck = document.getElementById('o-clock'); if (ck) ck.textContent = clock(now);
}, 1000);
setInterval(() => {
  document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = ago(Number(el.dataset.ago)); });
  document.querySelectorAll('[data-eta]').forEach(el => { el.textContent = minsLeft(Number(el.dataset.eta)); });
}, 30000);

applyPrefs();
renderChrome();
renderAll();
})();
</script>
